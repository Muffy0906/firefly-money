</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Money</h1>
    <p>Enter the dashboard password to continue.</p>
    <div id="loginErr" class="form-err" hidden></div>
    <input type="text" name="username" value="money" autocomplete="username" hidden>
    <label>Password<input type="password" id="loginPw" autocomplete="current-password" required autofocus></label>
    <label class="check"><input type="checkbox" id="loginRemember" checked> Keep me signed in on this computer</label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">Money</div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="foot">
      <div class="label">Theme</div>
      <div class="themes" id="themes"></div>
      <div class="toggles"><button type="button" data-tg="privacy" data-onclick="App.togglePrivacy()"></button><button type="button" data-tg="compact" data-onclick="App.toggleDensity()"></button></div>
      <a id="ffLink" href="${FIREFLY_URL}" target="_blank" rel="noopener">Open Firefly III ↗</a>
      <button type="button" data-onclick="App.signOut()">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<button id="fab" class="fab" type="button" data-onclick="App.quickAdd()" aria-label="Add transaction (N)" title="Add transaction (N)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="palette" class="palette" hidden data-onclick="App.palBackdrop(event,this)">
  <div class="palette-box"><input id="palQ" type="text" placeholder="Jump to a page, account, budget… or type to search transactions" autocomplete="off"
    data-oninput="App.palFilter()" data-onkeydown="App.palKey(event)"><div id="palList" class="pal-list"></div>
    <div class="pal-foot"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div></div>
</div>
<div id="undo" class="undo" role="status" aria-live="polite" hidden></div>
<div id="calpop" class="calpop" hidden></div>
<div id="pickpop" class="pickpop" hidden></div>
<div id="ptr" class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
<div id="tip" class="tip" hidden></div>
<div id="scrim" class="scrim" data-onclick="App.closeDrawer()"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true"></aside>
<dialog id="confirm"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/events.js?v=${MONEY_VERSION}"></script>
<script src="/assets/js/core.js?v=${MONEY_VERSION}"></script>
<script src="/assets/js/extras.js?v=${MONEY_VERSION}"></script>

<script src="/assets/js/polish.js?v=${MONEY_VERSION}"></script>

<script src="/assets/js/planning.js?v=${MONEY_VERSION}"></script>

<script src="/assets/js/insights.js?v=${MONEY_VERSION}"></script>

<script src="/assets/js/ui.js?v=${MONEY_VERSION}"></script>

<script src="/assets/js/shell.js?v=${MONEY_VERSION}"></script>

</body>
</html>
