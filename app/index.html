<script>
'use strict';
/* =====================================================================
   Planning features: safe-to-spend forecast, categorize inbox,
   loan payoff planner, installable app.
   ===================================================================== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('money.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('money.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
function bizDay(y, m, day) {            // that day of the month (clamped), moved back to Friday if it's a weekend
  const d = new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()), 12);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
  return isoDate(d);
}
function monthsFrom(from, to) { const out = []; let d = new Date(from + 'T12:00:00'); d.setDate(1); const end = new Date(to + 'T12:00:00'); while (d <= end) { out.push([d.getFullYear(), d.getMonth()]); d.setMonth(d.getMonth() + 1); } return out; }

/* ---------- Loan history (payments into each loan) ---------- */
async function loanHistory(loans) {
  const out = {};
  await Promise.all(loans.map(async l => {
    const groups = (await getAll('/accounts/' + l.id + '/transactions').catch(() => [])).map(normGroup);
    const pays = [];
    let borrowed = Math.abs(l.opening), repaid = 0;
    groups.forEach(g => g.splits.forEach(s => {
      if (s.type === 'opening balance') return;
      if (s.source_id === l.id) borrowed += s.amount;
      else if (s.destination_id === l.id) { repaid += s.amount; pays.push({ d: String(s.date).slice(0, 10), a: s.amount, from: s.source_id }); }
    }));
    pays.sort((a, b) => a.d.localeCompare(b.d));
    const cutoff = isoDate(new Date(Date.now() - 91 * 864e5));
    const recent = pays.filter(p => p.d >= cutoff).reduce((s, p) => s + p.a, 0);
    const last = pays[pays.length - 1] || null;
    // Typical monthly payment: the latest payment if it was recent, otherwise the 3-month average.
    const detected = last && daysBetween(last.d, todayIso()) <= 45 ? Math.round(last.a) : Math.round(recent / 3);
    const monthly = l.plan && l.plan.amount > 0 ? l.plan.amount : detected;   // the loan's own monthly payment, if set
    out[l.id] = { borrowed, repaid, pays, last, monthly,
      pct: borrowed > 0 ? Math.min(100, Math.max(0, repaid / borrowed * 100)) : null };
  }));
  return out;
}

/* ================= Safe-to-spend forecast ================= */
function detectIncome(groups, accIds) {
  const by = {};
  groups.forEach(g => g.splits.forEach(s => {
    if (s.type !== 'deposit' || !accIds.includes(s.destination_id)) return;
    const src = S.lists.byId[s.source_id]; if (src && isLiab(src)) return;          // loan money isn't income
    (by[s.source_id] = by[s.source_id] || { name: s.source_name, list: [] }).list.push({ d: String(s.date).slice(0, 10), a: s.amount, cat: s.category });
  }));
  const out = [];
  Object.values(by).forEach(({ name, list }) => {
    if (list.length < 3) return;
    list.sort((a, b) => a.d.localeCompare(b.d));
    const recent = list.slice(-6), lastAmt = recent[recent.length - 1].a;
    if (recent.filter(x => Math.abs(x.a - lastAmt) / lastAmt < .2).length < 3) return;   // needs a steady amount
    const gaps = recent.slice(1).map((x, i) => daysBetween(recent[i].d, x.d)).sort((a, b) => a - b), gap = gaps[Math.floor(gaps.length / 2)];
    const doms = recent.map(x => +x.d.slice(8, 10));
    let p;
    if (gap >= 12 && gap <= 17) {
      const late = doms.filter(d => d >= 25).length, mid = doms.filter(d => d >= 11 && d <= 18).length;
      p = late && mid && late + mid >= doms.length - 1 ? { kind: 'semimonthly' } : { kind: 'every', n: 14 };
    } else if (gap >= 26 && gap <= 35) { const s = doms.slice().sort((a, b) => a - b), med = s[Math.floor(s.length / 2)]; p = { kind: 'monthly', day: med >= 28 ? 31 : med }; }
    else if (gap >= 6 && gap <= 8) p = { kind: 'every', n: 7 };
    else return;
    const last = recent[recent.length - 1].d;
    if (daysBetween(last, todayIso()) > gap * 1.8) return;                                  // stopped arriving
    out.push({ name, amount: lastAmt, p, last, salary: recent.some(x => /salary|payroll/i.test(x.cat)) });
  });
  return out;
}
function incomeDates(inc, from, to) {
  const out = [], p = inc.p;
  if (p.kind === 'every') { for (let d = addDays(inc.last, p.n); d <= to; d = addDays(d, p.n)) if (d >= from) out.push(d); }
  else monthsFrom(from, to).forEach(([y, m]) => (p.kind === 'semimonthly' ? [15, 31] : [p.day]).forEach(day => { const d = bizDay(y, m, day); if (d > inc.last && d >= from && d <= to) out.push(d); }));
  return out.sort();
}
async function forecastModel(sel, horizon) {
  const L = await lists();
  const banks = L.own.filter(a => isAsset(a) && !isCard(a));
  const from = todayIso(), to = addDays(from, horizon);
  const [deps, recs, bills] = await Promise.all([
    getAll('/transactions', { type: 'deposit', start: addDays(from, -120), end: from }),
    getAll('/recurrences').catch(() => []),
    getAll('/bills', { start: from, end: to }).catch(() => []),
  ]);
  const depGroups = deps.map(normGroup);
  // Default account: the one your salary lands in.
  if (!sel) {
    const guess = detectIncome(depGroups, banks.map(a => a.id)).sort((a, b) => (b.salary - a.salary) || b.amount - a.amount)[0];
    const hit = guess && depGroups.flatMap(g => g.splits).find(s => s.source_name === guess.name);
    sel = hit ? hit.destination_id : (banks[0] || {}).id;
  }
  const accIds = sel === 'all' ? banks.map(a => a.id) : [sel];
  const start = accIds.reduce((s, id) => s + ((L.byId[id] || {}).balance || 0), 0);
  const ev = [];
  const add = (date, label, kind, amount, series) => { if (date >= from && date <= to && amount) ev.push({ date, label, kind, amount, key: kind + ':' + series }); };
  const incomes = detectIncome(depGroups, accIds);
  incomes.forEach(inc => incomeDates(inc, from, to).forEach(d => add(d, inc.name, inc.salary ? 'Payday' : 'Income', inc.amount, inc.name)));
  recs.forEach(r => {
    const at = r.attributes; if (at.active === false) return;
    const t = (at.transactions || [])[0] || {}, occ = (at.repetitions || []).flatMap(x => x.occurrences || []).map(d => String(d).slice(0, 10));
    const sign = accIds.includes(String(t.source_id)) ? -1 : accIds.includes(String(t.destination_id)) ? 1 : 0;
    if (sign) [...new Set(occ)].forEach(d => add(d, at.title, 'Recurring', sign * num(t.amount), 'rec' + r.id));
  });
  const loans = L.own.filter(a => isLiab(a) && a.debt > 0), hist = await loanHistory(loans);
  loans.forEach(l => {
    const h = hist[l.id], p = l.plan;
    if (p && p.amount > 0) {
      const src = p.from ? L.accounts.find(x => sameName(x.name, p.from)) : (h && h.last ? L.byId[h.last.from] : null);
      if (!src || !accIds.includes(src.id)) return;
      const day = p.day || (h && h.last ? +h.last.d.slice(8, 10) : 1);
      let left = l.debt;
      monthsFrom(addDays(from, -31), to).forEach(([y, m]) => {
        const d = isoDate(new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()), 12));
        if (left <= 0 || d > to) return;
        if (h && h.last && h.last.d >= addDays(d, -20)) return;           // already paid for this month
        if (d < from && daysBetween(d, from) > 10) return;                // long past: not counted
        const amt = Math.min(p.amount, left); left -= amt;
        add(d < from ? from : d, 'Payment to ' + l.name, 'Loan', -amt, 'loan' + l.id);
      });
      return;
    }
    if (!h || !h.last || daysBetween(h.last.d, from) > 75) return;
    if (!accIds.includes(h.last.from)) return;
    let left = l.debt, day = +h.last.d.slice(8, 10);
    monthsFrom(addDays(h.last.d, 20), to).forEach(([y, m]) => {
      const d = isoDate(new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()), 12));
      if (d <= h.last.d || left <= 0) return;
      const amt = Math.min(h.last.a, left); left -= amt;
      add(d < from ? from : d, 'Payment to ' + l.name, 'Loan', -amt, 'loan' + l.id);
    });
  });
  const firstPay = ev.filter(e => e.kind === 'Payday' || e.kind === 'Income').map(e => e.date).sort()[0];
  L.own.filter(a => isCard(a) && a.balance < 0).forEach(c => {
    let d;
    if (c.paymentDate) { const day = +String(c.paymentDate).slice(8, 10); d = monthsFrom(from, to).map(([y, m]) => isoDate(new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()), 12))).find(x => x >= from); }
    add(d || firstPay || addDays(from, 7), 'Pay off ' + c.name, 'Card', c.balance, 'card' + c.id);
  });

<script>
'use strict';
/* =====================================================================
   Insight cards: short, auto-generated observations on the Overview.
   Compares this month against the same point in the previous 3 months.
   ===================================================================== */
const INS_ICON = {
  up: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  down: '<path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/>',
  budget: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
};
async function insightCards({ cur, future, budgets, limits, cards, trend }) {
  if (future) return '';
  const now = new Date(), isCur = cur.y === now.getFullYear() && cur.m === now.getMonth();
  const dim = new Date(cur.y, cur.m + 1, 0).getDate(), N = isCur ? now.getDate() : dim;
  const win = mr => { const d = new Date(mr.y, mr.m + 1, 0).getDate(); return { start: mr.start, end: mr.start.slice(0, 8) + pad(Math.min(N, d)) }; };
  const pull = async w => {
    const [c, u] = await Promise.all([api('/insight/expense/category', { params: w }), api('/insight/expense/no-category', { params: w }).catch(() => [])]);
    const m = new Map(); arr(c).forEach(x => m.set(x.name, { id: x.id, amt: (m.get(x.name) || { amt: 0 }).amt + absDiff(x) }));
    return { cats: m, total: sumDiff(c) + sumDiff(u) };
  };
  const nowW = win(cur), past = [1, 2, 3].map(i => win(monthRange(cur.y, cur.m - i)));
  const [me, ...hist] = await Promise.all([pull(nowW), ...past.map(pull)]);
  const used = hist.filter(h => h.total > 0);
  if (!used.length) return '';
  const byLabel = isCur ? 'by the ' + ordinal(N) : 'in ' + cur.short;
  const out = [];
  const add = (id, tone, ic, title, detail, href, score) => out.push({ id: cur.y + '-' + (cur.m + 1) + ':' + id, tone, ic, title, detail, href, score });

  // 1. Overall pace
  const avg = used.reduce((a, h) => a + h.total, 0) / used.length, pct = avg ? (me.total - avg) / avg : 0;
  if (Math.abs(pct) >= .1) add('pace', pct > 0 ? 'up' : 'down', pct > 0 ? 'up' : 'down',
    'Spending is ' + Math.round(Math.abs(pct) * 100) + '% ' + (pct > 0 ? 'higher' : 'lower') + ' than usual',
    money0(me.total) + ' ' + (isCur ? 'so far' : 'in ' + cur.short) + ' vs. about ' + money0(avg) + ' ' + byLabel + ' in a typical month', '#/transactions?type=withdrawal', 30 + Math.min(40, Math.abs(pct) * 60));
  else add('pace', 'down', 'check', 'Spending is right on track', money0(me.total) + ' ' + (isCur ? 'so far' : 'in ' + cur.short) + ', close to your usual ' + money0(avg) + ' ' + byLabel, '#/reports', 8);

  // 2. Categories that moved the most
  const names = new Set([...me.cats.keys(), ...used.flatMap(h => [...h.cats.keys()])]);
  const moves = [];
  names.forEach(name => {
    const c = me.cats.get(name), amt = c ? c.amt : 0, a = used.reduce((s, h) => s + ((h.cats.get(name) || {}).amt || 0), 0) / used.length;
    const id = (c || used.map(h => h.cats.get(name)).find(Boolean) || {}).id, d = amt - a;
    if (a < 1 && amt >= 100) moves.push({ name, id, amt, a, d, p: Infinity, score: 30 + Math.min(30, amt / 40) });
    else if (a >= 25 && d >= 40 && d / a >= .3) moves.push({ name, id, amt, a, d, p: d / a, score: 25 + Math.min(40, d / a * 30) + Math.min(15, d / 50) });
    else if (a >= 60 && -d >= 50 && -d / a >= .35) moves.push({ name, id, amt, a, d, p: d / a, score: 12 + Math.min(20, -d / 40) });
  });
  const ups = moves.filter(m => m.d > 0).sort((x, y) => y.score - x.score).slice(0, 2), downs = moves.filter(m => m.d < 0).sort((x, y) => y.score - x.score).slice(0, 1);
  [...ups, ...downs].forEach(m => {
    const href = m.id ? '#/transactions?category=' + m.id : '#/transactions';
    if (m.p === Infinity) add('cat:' + m.name, 'up', 'spark', money0(m.amt) + ' on ' + m.name, 'Nothing spent here ' + byLabel + ' in the last 3 months', href, m.score);
    else add('cat:' + m.name, m.d > 0 ? 'up' : 'down', m.d > 0 ? 'up' : 'down', m.name + ' is ' + Math.round(Math.abs(m.p) * 100) + '% ' + (m.d > 0 ? 'above' : 'below') + ' usual',
      money0(m.amt) + ' vs. about ' + money0(m.a) + ' ' + byLabel + ' in a typical month', href, m.score);
  });

  if (isCur) {
    // 3. Budgets on pace to run out before the month ends (ones already near/over the limit show in "Needs attention")
    budgets.filter(b => b.attributes.active !== false).forEach(b => {
      const lim = limits[String(b.id)], spent = Math.abs((b.attributes.spent || []).reduce((s, x) => s + num(x.sum), 0));
      if (!lim || !lim.amount || spent >= lim.amount * .85 || N < 5) return;
      const perDay = spent / N, runDay = perDay > 0 ? Math.ceil(lim.amount / perDay) : Infinity;
      if (runDay >= dim) return;
      add('bud:' + b.id, 'warn', 'budget', b.attributes.name + ' may run out around ' + fmtDay(cur.start.slice(0, 8) + pad(runDay)),
        money0(spent) + ' of ' + money0(lim.amount) + ' used · about ' + money0(perDay) + '/day so far', '#/transactions?budget=' + b.id, 38 + (dim - runDay));
    });
    // 4. Credit card payments coming up
    cards.forEach(a => {
      const owed = Math.max(0, -a.balance), day = +String(a.paymentDate || '').slice(8, 10);
      if (!owed || !day) return;
      let due = new Date(now.getFullYear(), now.getMonth(), Math.min(day, dim), 12);
      if (due < new Date(now.getFullYear(), now.getMonth(), now.getDate())) due = new Date(now.getFullYear(), now.getMonth() + 1, day, 12);
      const days = Math.round((due - new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12)) / 864e5);
      if (days > 7) return;
      add('card:' + a.id, 'warn', 'card', a.name + ' payment due ' + (days === 0 ? 'today' : days === 1 ? 'tomorrow' : 'in ' + days + ' days'),
        money(owed) + ' owed · due ' + fmtDay(isoDate(due)), '#/account/' + a.id, 55 - days);
    });
  } else if (trend && trend.length >= 2) {
    // 5. Savings rate for a finished month
    const a = trend[trend.length - 1], b = trend[trend.length - 2];
    if (a.income > 0) {
      const r = (a.income - a.spend) / a.income, rb = b.income > 0 ? (b.income - b.spend) / b.income : null;
      add('kept', r >= (rb ?? r) ? 'down' : 'up', 'check', 'You kept ' + Math.round(r * 100) + '% of your income',
        rb === null ? money0(a.income - a.spend) + ' of ' + money0(a.income) : (r >= rb ? 'Up' : 'Down') + ' from ' + Math.round(rb * 100) + '% in ' + b.label, '#/reports', 20);
    }
  }

  const hidden = LS.get('insightsHidden', {});
  const shown = out.filter(x => !hidden[x.id]).sort((a, b) => b.score - a.score).slice(0, 4);
  if (!shown.length) return '';
  return '<div class="insights" id="insights" aria-label="Insights">' + shown.map(x =>
    '<div class="insight t-' + x.tone + '" role="link" tabindex="0" data-ins="' + esc(x.id) + '" onclick="location.hash=\'' + x.href + '\'" onkeydown="if(event.key===\'Enter\')this.click()">' +
      '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + INS_ICON[x.ic] + '</svg></span>' +
      '<span><div class="t">' + esc(x.title) + '</div><div class="d">' + esc(x.detail) + '</div></span>' +
      '<button class="x" type="button" aria-label="Dismiss" title="Hide this" onclick="event.stopPropagation();App.hideInsight(this)">×</button></div>').join('') + '</div>';
}
function hideInsight(btn) {
  const card = btn.closest('.insight'), id = card.dataset.ins, box = el('insights');
  const hidden = LS.get('insightsHidden', {}); hidden[id] = Date.now();
  Object.keys(hidden).forEach(k => { if (Date.now() - hidden[k] > 100 * 864e5) delete hidden[k]; });
  LS.set('insightsHidden', hidden);
  const rest = [...box.children].filter(c => c !== card);
  vt('ins', () => { card.remove(); if (!rest.length) box.remove(); }, () => rest.forEach((c, i) => vtName(c, 'ins' + i)));

Object.assign(window.App, { insightCards, hideInsight });
</script>

<script>

/* ---------- Infinite scroll for transaction lists ---------- */
function bindFeed() {
  const m = el('feedMore'), f = S.feed; if (!m || !f) return;
  const io = new IntersectionObserver(async ents => {
    if (!ents.some(x => x.isIntersecting) || f.busy) return;
    if (S.feed !== f || !m.isConnected) return io.disconnect();
    f.busy = true;
    try {
      const gs = await f.more(f.next);
      if (S.feed !== f || !m.isConnected) return;
      f.next++; appendRows(gs, f.opts);
      if (f.next > f.pages || !gs.length) { io.disconnect(); m.remove(); } else { io.unobserve(m); io.observe(m); }
    } catch (e) { m.textContent = 'Couldn’t load more: ' + e.message; io.disconnect(); }
    finally { f.busy = false; }
  }, { rootMargin: '700px 0px' });
  io.observe(m);
}

/* ---------- Sparklines: last 30 days of each account's balance ---------- */
async function balanceSparks(accounts) {
  const start = addDays(todayIso(), -30), end = todayIso(), out = {};
  const gs = (await getAll('/transactions', { start, end, type: 'all' })).map(normGroup);     // one request for every account
  accounts.forEach(a => {
    const byDay = {}; gs.forEach(g => { const v = signed(g, a.id); if (v) { const d = String(g.date).slice(0, 10); byDay[d] = (byDay[d] || 0) + v; } });
    let bal = a.balance; const vals = [];
    for (let i = 0; i <= 30; i++) { const d = addDays(end, -i); vals.push(bal); bal -= byDay[d] || 0; }
    out[a.id] = vals.reverse();
  });
  return out;
}
function sparkline(vals, owed) {
  const v = owed ? vals.map(x => Math.max(0, -x)) : vals, W = 64, H = 20;
  const lo = Math.min(...v), hi = Math.max(...v), rng = hi - lo || 1;
  const pts = v.map((y, i) => [(i / (v.length - 1)) * W, H - 2 - ((y - lo) / rng) * (H - 4)]);
  const up = v[v.length - 1] >= v[0], good = owed ? !up : up;
  const tip = (owed ? 'Owed ' : 'Balance ') + money0(v[0]) + ' → ' + money0(v[v.length - 1]) + ' over 30 days';
  return '<svg class="spark ' + (hi === lo ? 'flat' : good ? 'good' : 'bad') + '" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" data-tip="' + esc(tip) + '" aria-hidden="true">' +
    '<polyline points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/><circle cx="' + pts[pts.length - 1][0] + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="2"/></svg>';
}

/* ---------- Daily spending heatmap ---------- */
function heatmapPanel(cur, groups) {
  const by = {}, cnt = {};
  groups.forEach(g => { const d = String(g.date).slice(0, 10); by[d] = (by[d] || 0) + g.total; cnt[d] = (cnt[d] || 0) + 1; });
  const dim = new Date(cur.y, cur.m + 1, 0).getDate(), lead = new Date(cur.y, cur.m, 1).getDay(), t = todayIso();
  const max = Math.max(1, ...Object.values(by)), days = Object.keys(by).length;
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="hm-cell pad"></span>';
  for (let d = 1; d <= dim; d++) {
    const iso = cur.start.slice(0, 8) + pad(d), v = by[iso] || 0, fut = iso > t;
    const pct = v ? Math.round(18 + 82 * Math.sqrt(v / max)) : 0;
    cells += '<button type="button" class="hm-cell' + (fut ? ' fut' : '') + (iso === t ? ' today' : '') + '"' + (v ? ' style="--p:' + pct + '%"' : '') +
      ' data-tip="' + esc(fmtDay(iso) + (v ? ' · ' + money(v) + ' · ' + cnt[iso] + ' purchase' + (cnt[iso] === 1 ? '' : 's') : fut ? '' : ' · nothing spent')) + '"' +
      (v ? ' onclick="location.hash=\'#/transactions?search=date_on:' + iso + '\'"' : ' disabled') + '><span>' + d + '</span></button>';
  }
  const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];

    '<div class="hm"><div class="hm-dow">' + ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => '<span>' + x + '</span>').join('') + '</div><div class="hm-grid">' + cells + '</div></div>' +
    '<div class="hm-foot"><span>' + (top ? 'Biggest day: <strong class="num">' + money0(top[1]) + '</strong> on ' + fmtDay(top[0]) : 'No spending yet') + '</span><span>' + free + ' no-spend day' + (free === 1 ? '' : 's') + '</span></div></section>';
}

/* ---------- Money flow (income → spending categories + kept) ---------- */
function sankeyPanel(sources, income, cats, cur) {
  let left = sources.map(x => ({ name: x.name, v: absDiff(x) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  if (!left.length && income > 0) left = [{ name: 'Income', v: income }];
  if (left.length > 4) { const rest = left.slice(3); left = left.slice(0, 3); left.push({ name: rest.length + ' other sources', v: rest.reduce((s, x) => s + x.v, 0) }); }
  let right = cats.map(c => ({ name: c.name, v: c.amt, id: c.id })).sort((a, b) => b.v - a.v);
  if (right.length > 7) { const rest = right.slice(6); right = right.slice(0, 6); right.push({ name: rest.length + ' other categories', v: rest.reduce((s, x) => s + x.v, 0) }); }
  const inc = left.reduce((s, x) => s + x.v, 0), spend = right.reduce((s, x) => s + x.v, 0);
  if (!inc && !spend) return '';
  left.forEach(x => { x.kind = 'in'; });
  right.forEach(x => { x.kind = 'out'; });
  if (spend > inc) left.push({ name: 'From savings', v: spend - inc, kind: 'save' });
  if (inc > spend) right.push({ name: 'Kept', v: inc - spend, kind: 'kept' });
  const total = Math.max(inc, spend), narrow = innerWidth < 640;
  const W = narrow ? 460 : 900, LW = narrow ? 118 : 190, NW = 12, GAP = 10, H = Math.max(220, 36 * Math.max(left.length, right.length) + 24);
  const k = (H - 20 - GAP * (Math.max(left.length, right.length) - 1)) / total;
  const stack = (nodes, x) => { const hh = nodes.reduce((s, n) => s + n.v * k, 0) + GAP * (nodes.length - 1); let y = (H - hh) / 2; nodes.forEach(n => { n.x = x; n.y = y; n.h = Math.max(2, n.v * k); y += n.h + GAP; }); };
  const xl = LW, xm = W / 2 - NW / 2, xr = W - LW - NW;
  stack(left, xl); stack(right, xr);
  const mh = total * k, my = (H - mh) / 2;
  const col = n => ({ in: 'var(--income)', save: 'var(--warn)', out: 'var(--spend)', kept: 'var(--good)' })[n.kind];
  const band = (x0, y0, x1, y1, h) => { const c = (x0 + x1) / 2; return 'M' + x0 + ',' + y0 + 'C' + c + ',' + y0 + ' ' + c + ',' + y1 + ' ' + x1 + ',' + y1 + 'L' + x1 + ',' + (y1 + h) + 'C' + c + ',' + (y1 + h) + ' ' + c + ',' + (y0 + h) + ' ' + x0 + ',' + (y0 + h) + 'Z'; };
  let links = '', nodes = '', my1 = my, my2 = my;
  const share = (n, of) => of ? ' (' + Math.round(n.v / of * 100) + '%)' : '';
  left.forEach(n => { links += '<path class="lk" d="' + band(xl + NW, n.y, xm, my1, n.h) + '" fill="' + col(n) + '" data-tip="' + esc(n.name + ' → ' + money0(n.v) + share(n, total)) + '"/>'; my1 += n.h; });
  right.forEach(n => { links += '<path class="lk" d="' + band(xm + NW, my2, xr, n.y, n.h) + '" fill="' + col(n) + '" data-tip="' + esc(n.name + ' · ' + money0(n.v) + share(n, n.kind === 'kept' ? inc : spend) + (n.kind === 'kept' ? ' of income' : n.kind === 'out' ? ' of spending' : '')) + '"' +
    (n.id ? ' style="cursor:pointer" onclick="location.hash=\'#/transactions?category=' + n.id + '\'"' : '') + '/>'; my2 += n.h; });
  const label = (n, anchor, x) => '<text x="' + x + '" y="' + (n.ly - 2) + '" text-anchor="' + anchor + '" class="sk-name">' + esc(n.name.length > (narrow ? 14 : 24) ? n.name.slice(0, narrow ? 13 : 23) + '…' : n.name) + '</text>' +
    '<text x="' + x + '" y="' + (n.ly + 12) + '" text-anchor="' + anchor + '" class="sk-amt amtx">' + money0(n.v) + '</text>';
  // Keep two-line labels from colliding: push each label down past the previous one, then pull the column back up if it overflows
  const spread = nodes2 => { let prev = -Infinity; nodes2.forEach(n => { n.ly = Math.max(n.y + n.h / 2, prev + 30); prev = n.ly; });
    const over = prev + 16 - H; if (over > 0) { let next = Infinity; [...nodes2].reverse().forEach(n => { n.ly = Math.min(n.ly - over, next - 30); next = n.ly; }); } };
  spread(left); spread(right);
  left.forEach(n => { nodes += '<rect x="' + n.x + '" y="' + n.y + '" width="' + NW + '" height="' + n.h + '" rx="3" fill="' + col(n) + '"/>' + label(n, 'end', xl - 8); });
  right.forEach(n => { nodes += '<rect x="' + n.x + '" y="' + n.y + '" width="' + NW + '" height="' + n.h + '" rx="3" fill="' + col(n) + '"/>' + label(n, 'start', xr + NW + 8); });
  nodes += '<rect x="' + xm + '" y="' + my + '" width="' + NW + '" height="' + mh + '" rx="3" fill="var(--text)" opacity=".75"/>';
  return '<section class="panel chart sankey"><h2>Money flow</h2><p class="lead">Where ' + esc(cur.label) + '’s income went · hover a band for details</p>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Income flowing into spending categories">' + links + nodes + '</svg></section>';
}

/* ---------- Natural-language quick add ---------- */
const WDAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const MONS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const FILLER = new Set(['on', 'with', 'via', 'using', 'at', 'for', 'to', 'from', 'paid', 'spent', 'bought', 'got', 'and', 'the', 'a', 'my', 'in']);
const GENERIC = new Set(['card', 'checking', 'savings', 'saving', 'account', 'bank', 'credit', 'debit', 'loan', 'gold', 'the']);
function nlDate(ws, i) {
  const w = ws[i].toLowerCase().replace(/[,.]$/, ''), t = new Date(); t.setHours(12, 0, 0, 0);
  const iso = d => isoDate(d);
  if (w === 'today') return [iso(t), 1];
  if (w === 'yesterday') { t.setDate(t.getDate() - 1); return [iso(t), 1]; }
  if (w === 'tomorrow') { t.setDate(t.getDate() + 1); return [iso(t), 1]; }
  if (/^\d{1,2}$/.test(w) && /^days?$/i.test(ws[i + 1] || '') && /^ago$/i.test(ws[i + 2] || '')) { t.setDate(t.getDate() - +w); return [iso(t), 3]; }
  const wd = WDAYS.findIndex(d => w.length >= 3 && d.startsWith(w) && (w.length >= 3 && (w === d || w === d.slice(0, 3) || w === d.slice(0, 4))));
  if (wd >= 0) { let back = (t.getDay() - wd + 7) % 7; if (back === 0 && /^last$/i.test(ws[i - 1] || '')) back = 7; t.setDate(t.getDate() - back); return [iso(t), 1]; }
  let m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(w);
  if (m) { const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : t.getFullYear(); const d = new Date(y, +m[1] - 1, +m[2], 12); if (!m[3] && d > t) d.setFullYear(y - 1); return [iso(d), 1]; }
  const mi = MONS.findIndex(x => w.startsWith(x) && w.length <= 9);
  if (mi >= 0 && /^\d{1,2}(st|nd|rd|th)?,?$/i.test(ws[i + 1] || '')) { const d = new Date(t.getFullYear(), mi, parseInt(ws[i + 1], 10), 12); if (d > t) d.setFullYear(d.getFullYear() - 1); return [iso(d), 2]; }
  return null;
}
function nlAccount(tok) {
  const L = S.lists, w = tok.toLowerCase(); if (w.length < 3) return null;
  const pool = L.own.filter(a => isAsset(a) || isLiab(a));
  const full = pool.filter(a => a.name.toLowerCase() === w); if (full.length) return full[0];
  const hits = pool.filter(a => a.name.toLowerCase().split(/[\s\-–]+/).some(x => x.startsWith(w) && (!GENERIC.has(w) || x === w)));
  return hits.length === 1 ? hits[0] : hits.find(a => a.name.toLowerCase().startsWith(w)) || null;
}
function nlParse(text, submit) {
  const f = S.form; if (!f || f.id) return;
  collectTx();
  if (!f.nlBase) { const s0 = f.splits[0]; f.nlBase = { type: f.type, date: f.date, main: f.main, src: f.src, dst: f.dst, split: { amount: s0.amount, description: s0.description, counter: s0.counter, category: s0.category } }; }
  const base = f.nlBase, L = S.lists, ws = text.trim().split(/\s+/).filter(Boolean), used = new Set(), out = {};
  // dates first (so "sep 12" isn't read as an amount of 12)
  for (let i = 0; i < ws.length; i++) { if (used.has(i) || out.date) continue; const r = nlDate(ws, i); if (r) { out.date = r[0]; for (let j = 0; j < r[1]; j++) used.add(i + j); if (/^last$/i.test(ws[i - 1] || '')) used.add(i - 1); } }
  ws.forEach((w, i) => { if (!used.has(i) && out.amount == null && /^\$?\d+(?:[.,]\d{1,2})?\$?$/.test(w)) { out.amount = w.replace(/\$/g, '').replace(',', '.'); used.add(i); } });
  ws.forEach((w, i) => {
    const lw = w.toLowerCase();
    if (used.has(i)) return;
    if (/^(income|salary|paycheck|payday|refund|received|deposit|earned)$/.test(lw)) { out.type = 'deposit'; used.add(i); if (!/^(received|earned)$/.test(lw)) out.kw = lw[0].toUpperCase() + lw.slice(1); if (/^(salary|paycheck)$/.test(lw)) out.catHint = 'Salary'; }
    else if (/^(transfer|transferred|moved|move)$/.test(lw)) { out.type = 'transfer'; used.add(i); }
    else if (lw[0] === '#' && lw.length > 1) { const c = L.categories.find(c => c.name.toLowerCase().startsWith(lw.slice(1))); out.category = c ? c.name : w.slice(1); used.add(i); }
  });
  const accs = [];
  ws.forEach((w, i) => { if (used.has(i) || FILLER.has(w.toLowerCase())) return; const a = nlAccount(w.replace(/[,.]$/, '')); if (a && !accs.some(x => x.a.id === a.id)) { accs.push({ a, i, from: /^from$/i.test(ws[i - 1] || ''), to: /^to$/i.test(ws[i - 1] || '') }); used.add(i); } });
  // "for groceries" → category if it names one
  ws.forEach((w, i) => { if (!used.has(i) && /^for$/i.test(ws[i - 1] || '') && !out.category) { const c = L.categories.find(c => c.name.toLowerCase().startsWith(w.toLowerCase())); if (c && w.length >= 3) { out.category = c.name; used.add(i); } } });
  if (accs.length >= 2 && !out.type) out.type = 'transfer';
  const payeeWords = ws.filter((w, i) => !used.has(i) && !FILLER.has(w.toLowerCase()));
  let payee = payeeWords.join(' ').replace(/[,.]$/, '');
  const type = out.type || base.type;
  if (payee) {
    const pool = type === 'deposit' ? L.revenue : L.expense, q = payee.toLowerCase();
    const hit = pool.find(a => a.name.toLowerCase() === q) || pool.find(a => a.name.toLowerCase().startsWith(q)) || pool.find(a => a.name.toLowerCase().replace(/[^a-z0-9]/g, '').includes(q.replace(/[^a-z0-9]/g, '')) && q.length >= 4);
    payee = hit ? hit.name : payee.replace(/\b\w/g, c => c.toUpperCase());
  }
  // rebuild the form from the base + what was understood
  f.type = type; f.date = out.date || base.date;
  const sp = f.splits[0];
  Object.assign(sp, base.split);
  if (out.amount) sp.amount = out.amount;
  if (payee) { sp.description = payee; if (type !== 'transfer') sp.counter = payee; }
  else if (out.kw) sp.description = out.kw;
  if (out.category || out.catHint) sp.category = out.category || out.catHint;
  f.main = base.main; f.src = base.src; f.dst = base.dst;
  if (type === 'transfer') {
    const from = accs.find(x => x.from) || accs.find(x => !x.to) || accs[0], to = accs.find(x => x !== from);
    if (from) f.src = from.a.id; if (to) f.dst = to.a.id;
    if (!payee && from && to) sp.description = 'Transfer to ' + to.a.name;
  } else if (accs[0]) f.main = accs[0].a.id;
  const chip = (l, v) => '<span class="nlchip"><em>' + l + '</em>' + esc(v) + '</span>';
  f.nl = text;
  f.nlChips = text.trim() ? [
    type !== base.type ? chip('Type', { deposit: 'Income', transfer: 'Transfer', withdrawal: 'Expense' }[type]) : '',
    out.amount ? chip('Amount', money(num(out.amount))) : '',
    out.date ? chip('Date', dayLabel(out.date)) : '',
    type === 'transfer' ? (accs.length ? chip('From', (L.byId[f.src] || {}).name || '?') + (f.dst ? chip('To', (L.byId[f.dst] || {}).name || '?') : '') : '') : accs[0] ? chip('Account', accs[0].a.name) : '',
    payee && type !== 'transfer' ? chip(type === 'deposit' ? 'From' : 'Payee', payee) : '',
    sp.category && (out.category || out.catHint) ? chip('Category', sp.category) : '',
  ].join('') : '';
  const caret = el('nlq') ? el('nlq').selectionStart : text.length;
  renderTxForm();
  const q = el('nlq'); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) { /* ignore */ } }
  if (payee && type !== 'transfer' && !out.category && !out.catHint) payeeFill(0, payee);
  if (submit) {
    if (num(sp.amount) > 0 && sp.description.trim()) el('txForm').requestSubmit();
    else { const miss = el('drawerBody').querySelector(num(sp.amount) > 0 ? '[data-k=description]' : '[data-k=amount]'); if (miss) miss.focus(); toast(num(sp.amount) > 0 ? 'Add a description' : 'Add an amount'); }
  }
}

/* ---------- After each page paint ---------- */
function afterPaint2(r) {
  bindFeed(); bindDash(); drawToggles();
  S.kIdx = -1;
}
Object.assign(window.App, {
  buzz, togglePrivacy, toggleDensity, drawToggles, pick, pickFilter, pickKey, pickHover, pickChoose, afterPaint2, balanceSparks, sparkline, heatmapPanel, sankeyPanel,
  dashboard, dashButton, dashEdit, dashMove, dashWide, dashHide, dashReset, nlParse, shortcutsSheet,
});
</script>

<script>
'use strict';
/* =====================================================================
   App shell: iOS-style title bar, sheet effect, and the bridge to the
   native tab bar when running inside the iPhone app.
   ===================================================================== */
const SHELL = document.documentElement.classList.contains('shell');
function postNative(name, body) { try { window.webkit.messageHandlers[name].postMessage(body); } catch (e) { /* not in the app */ } }

/* ---------- Title bar: large title collapses into a small one; back button on detail pages ---------- */
const appbar = document.createElement('header');
appbar.id = 'appbar'; appbar.className = 'appbar';
appbar.innerHTML = '<a class="ab-back" hidden><svg viewBox="0 0 12 21" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10.5 10 19"/></svg><span></span></a><div class="ab-title"></div>';
el('app').prepend(appbar);
let abTick = false;
function appbarScroll() {
  abTick = false;
  const h1 = document.querySelector('#view .head h1');
  const edge = appbar.getBoundingClientRect().bottom || 44;
  appbar.classList.toggle('scrolled', h1 ? h1.getBoundingClientRect().bottom < edge + 2 : scrollY > 4);
}
function updateAppbar() {
  const h1 = document.querySelector('#view .head h1');
  appbar.querySelector('.ab-title').textContent = h1 ? h1.textContent : '';
  const backP = [...document.querySelectorAll('#view > p')].find(p => { const a = p.querySelector('a.link'); return a && /^\s*←/.test(a.textContent); });
  const btn = appbar.querySelector('.ab-back');
  if (backP) {
    const a = backP.querySelector('a.link');
    btn.hidden = false; btn.setAttribute('href', a.getAttribute('href'));
    btn.querySelector('span').textContent = a.textContent.replace(/^\s*←\s*/, '');
    backP.classList.add('shell-hide');
  } else btn.hidden = true;
  appbarScroll();
}
if (SHELL) {
  addEventListener('scroll', () => { if (!abTick) { abTick = true; requestAnimationFrame(appbarScroll); } }, { passive: true });
  new MutationObserver(updateAppbar).observe(el('view'), { childList: true });
}

/* ---------- Sheet open: page steps back; native tab bar hides ---------- */
let lastChrome = '';
function nativeChrome() {
  const open = el('drawer').classList.contains('open');
  if (SHELL && open !== document.documentElement.classList.contains('sheet-open')) {
    if (open) document.documentElement.style.setProperty('--sy', (scrollY + innerHeight / 2) + 'px');
    document.documentElement.classList.toggle('sheet-open', open);

Object.assign(window.App, { tabTap, updateAppbar });
