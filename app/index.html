<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e9e7e0; --text: #22221f; --muted: #8c897f;
    --faint: #efede7; --good: #5d7f6c; --spend: #c47a58; --income: #9fb8a8; --warn: #b8893a;
    --radius: 20px; --shadow: 0 18px 50px rgba(34, 34, 31, .12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1d1e1b; --line: #2b2c28; --text: #ecebe6; --muted: #8f8d85;
      --faint: #262723; --good: #8fb39e; --spend: #d9936f; --income: #4f6b5b; --warn: #d6a95a;
      --shadow: 0 18px 50px rgba(0, 0, 0, .5);
    }
  }

  /* ---------- Themes (set on <html data-theme="…">; none = follow the system) ---------- */
  :root { --accent: var(--text); --on-accent: var(--bg); color-scheme: light dark; }
  html[data-theme="light"] { --bg: #f6f5f1; --panel: #ffffff; --line: #e9e7e0; --text: #22221f; --muted: #8c897f; --faint: #efede7;
    --good: #5d7f6c; --spend: #c47a58; --income: #9fb8a8; --warn: #b8893a; --shadow: 0 18px 50px rgba(34,34,31,.12); color-scheme: light; }
  html[data-theme="dark"] { --bg: #151614; --panel: #1d1e1b; --line: #2b2c28; --text: #ecebe6; --muted: #8f8d85; --faint: #262723;
    --good: #8fb39e; --spend: #d9936f; --income: #4f6b5b; --warn: #d6a95a; --shadow: 0 18px 50px rgba(0,0,0,.5); color-scheme: dark; }
  html[data-theme="midnight"] { --bg: #0a0f1e; --panel: #111830; --line: #1f2946; --text: #e8ecfa; --muted: #8b97bb; --faint: #19223f;
    --good: #34d399; --spend: #fb7185; --income: #38bdf8; --warn: #fbbf24; --accent: #7c5cff; --on-accent: #ffffff;
    --hero-grad: linear-gradient(90deg, #a78bfa, #38bdf8); --shadow: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark; }
  html[data-theme="neon"] { --bg: #0d0221; --panel: #170838; --line: #2c1860; --text: #f6f2ff; --muted: #a79bd6; --faint: #221049;
    --good: #2ef2b4; --spend: #ff4d9d; --income: #00e0ff; --warn: #ffd166; --accent: #ff2e97; --on-accent: #ffffff;
    --hero-grad: linear-gradient(90deg, #ff2e97, #ffb347 55%, #00e0ff); --shadow: 0 18px 60px rgba(255,46,151,.15); color-scheme: dark; }
  html[data-theme="ocean"] { --bg: #041318; --panel: #0a2029; --line: #15343f; --text: #e2f5f8; --muted: #7ea5ae; --faint: #0f2b35;
    --good: #2dd4bf; --spend: #ff8a4c; --income: #3b9eff; --warn: #facc15; --accent: #14b8a6; --on-accent: #032126;
    --hero-grad: linear-gradient(90deg, #5eead4, #3b9eff); --shadow: 0 18px 50px rgba(0,0,0,.55); color-scheme: dark; }
  html[data-theme="sunrise"] { --bg: #fff7ee; --panel: #ffffff; --line: #f3e2cf; --text: #221a14; --muted: #8e7765; --faint: #fdecd9;
    --good: #0f9d6b; --spend: #e8452c; --income: #2f7ff0; --warn: #d98b00; --accent: #e8452c; --on-accent: #ffffff;
    --hero-grad: linear-gradient(90deg, #e8452c, #f59e0b); --shadow: 0 18px 50px rgba(232,69,44,.12); color-scheme: light; }
  html[data-theme="carbon"] { --bg: #161618; --panel: #1f1f23; --line: #2f2f36; --text: #f3f3f5; --muted: #9b9ba6; --faint: #2a2a30;
    --good: #39ff9f; --spend: #ff3d81; --income: #19e3ff; --warn: #ffe14d; --accent: #39ff9f; --on-accent: #0b0b0c;
    --hero-grad: linear-gradient(90deg, #39ff9f, #19e3ff); --shadow: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark; }
  html[data-theme="carbon"] .fill { box-shadow: 0 0 10px color-mix(in srgb, var(--spend) 70%, transparent); }
  html[data-theme="carbon"] .fill.good { box-shadow: 0 0 10px color-mix(in srgb, var(--good) 70%, transparent); }
  html[data-theme="carbon"] .btn.primary { box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); }
  html[data-theme="carbon"] .nav a.on { box-shadow: inset 3px 0 0 var(--accent), 0 0 0 1px var(--line); }
  html[data-theme="carbon"] .nav a.on svg { filter: drop-shadow(0 0 4px var(--accent)); }
  html[data-theme="carbon"] .chart rect { filter: drop-shadow(0 0 6px currentColor); }
  html[data-theme="carbon"] .pos, html[data-theme="carbon"] .down { text-shadow: 0 0 10px color-mix(in srgb, var(--good) 45%, transparent); }
  html[data-theme="carbon"] .neg, html[data-theme="carbon"] .up { text-shadow: 0 0 10px color-mix(in srgb, var(--spend) 45%, transparent); }
  html[data-theme="carbon"] .big { filter: drop-shadow(0 0 18px rgba(57,255,159,.25)); }
  html[data-theme="carbon"] .tabs a.on { box-shadow: 0 2px 8px -2px var(--accent); }
  html[data-theme="carbon"] .bulkbar { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 25%, transparent); }
  html[data-theme] .big.negative { --hero-grad: linear-gradient(90deg, var(--spend), var(--warn)); }
  html[data-theme="carbon"] .big.negative { filter: drop-shadow(0 0 18px rgba(255,61,129,.3)); }
  html[data-theme] .big { background: var(--hero-grad, none); -webkit-background-clip: text; background-clip: text; }
  html[data-theme="midnight"] .big, html[data-theme="neon"] .big, html[data-theme="ocean"] .big, html[data-theme="sunrise"] .big, html[data-theme="carbon"] .big, html[data-theme="glass"] .big { color: transparent; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .nav a.on svg { color: var(--accent); }
  .seg button.on { color: var(--accent); }
  .tabs a.on { border-color: var(--accent); }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .themes { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 12px 12px; }
  .side .foot .themes button { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .side .foot .themes button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .foot .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 12px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---------- Shell ---------- */
  .app { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; padding: 28px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .brand { font-weight: 650; font-size: 17px; letter-spacing: -.01em; padding: 0 12px 22px; }
  .nav a { display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 500; }
  .nav a:hover { background: var(--faint); color: var(--text); }
  .nav a.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); }
  .nav svg { width: 17px; height: 17px; flex: none; }
  .side .spacer { flex: 1; }
  .side .foot a, .side .foot button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 12px; color: var(--muted); font-size: 13px; text-decoration: none; cursor: pointer; border-radius: 8px; }
  .side .foot a:hover, .side .foot button:hover { background: var(--faint); color: var(--text); }
  main { padding: 34px 44px 72px; max-width: 1900px; width: 100%; }

  /* ---------- Page head ---------- */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  .head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .head .sub { color: var(--muted); margin: 2px 0 0; font-size: 13.5px; }
  .head .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .month { display: flex; align-items: center; gap: 4px; }
  .month span { min-width: 132px; text-align: center; font-weight: 500; }
  .round { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 15px; line-height: 1; }
  .round:disabled { opacity: .35; cursor: default; }

  /* ---------- Buttons & inputs ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary:hover { opacity: .88; }
  .btn.danger { color: var(--spend); }
  .btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
  .link:hover { color: var(--text); }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  label > input, label > select, label > textarea { display: block; width: 100%; margin-top: 5px; }
  input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 14.5px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--muted); }
  textarea { resize: vertical; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); }
  label.check input { width: auto; margin: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .seg { display: inline-flex; background: var(--faint); border-radius: 12px; padding: 3px; margin-bottom: 18px; }
  .seg button { border: 0; background: none; padding: 7px 16px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
  .tabs a { padding: 0 0 11px; text-decoration: none; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs a.on { color: var(--text); border-color: var(--accent); }
  .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
  .search { position: relative; flex: 1; max-width: 420px; }
  .search input { width: 100%; padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }

  /* ---------- Panels ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  .panel .lead { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .panel.flush { padding: 0; overflow: hidden; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 5px; }
  .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
  .stack { display: grid; gap: 20px; align-content: start; }
  .full { grid-column: 1 / -1; }
  /* Overview cards: flow into as many ~380px columns as fit (max 3), balanced automatically */
  .cards { columns: 3 380px; column-gap: 20px; margin-bottom: 20px; }
  .cards > .panel { break-inside: avoid; display: inline-block; width: 100%; margin-bottom: 20px; }
  .wide { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 1700px) { .wide { grid-template-columns: 1fr 1.4fr; } }
  .hero { display: grid; grid-template-columns: 1.3fr 2fr; gap: 32px; align-items: end; margin-bottom: 40px; }
  .big { font-size: 52px; font-weight: 300; letter-spacing: -.03em; line-height: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .stat .val { font-size: 25px; letter-spacing: -.02em; }
  .stat .sub, .sub-s { font-size: 12.5px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 22px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .kpi .val { font-size: 22px; letter-spacing: -.02em; }
  .total { font-size: 28px; font-weight: 300; letter-spacing: -.02em; margin-bottom: 14px; }
  .up { color: var(--spend); } .down { color: var(--good); }
  .neg { color: var(--spend); } .pos { color: var(--good); } .neutral { color: var(--muted); }

  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .row { padding: 10px 0; border-top: 1px solid var(--line); }
  .list .row:first-child { border-top: none; padding-top: 0; }
  .list a.row { text-decoration: none; }
  .list a.row:hover .name { text-decoration: underline; text-underline-offset: 3px; }
  .track { position: relative; height: 6px; background: var(--faint); border-radius: 99px; margin: 7px 0 4px; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--spend); border-radius: 99px; opacity: .85; max-width: 100%; }
  .fill.good { background: var(--good); } .fill.over { background: var(--spend); opacity: 1; }
  .tick { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--text); opacity: .35; border-radius: 1px; }
  .cat { margin-bottom: 16px; } .cat:last-child { margin-bottom: 0; }
  .cat .sub { font-size: 12px; color: var(--muted); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .center-empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  .loading { color: var(--muted); padding: 90px 0; text-align: center; }
  .error { background: var(--faint); border-radius: 14px; padding: 16px 18px; color: var(--text); }
  .chip { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--faint); color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--spend); }
  .tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagcloud .chip { font-size: 13px; padding: 4px 6px 4px 12px; display: inline-flex; gap: 6px; align-items: center; }
  .tagcloud .chip a { text-decoration: none; color: var(--text); }
  .tagcloud .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 14px; }

  /* ---------- Tables ---------- */
  table.tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: var(--faint); }
  .tbl .r { text-align: right; }
  .tbl .date { color: var(--muted); white-space: nowrap; width: 80px; }
  .tbl .desc { font-weight: 500; }
  .tbl .meta { margin-top: 3px; }
  .tbl .flow { color: var(--muted); font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl .amt { text-align: right; white-space: nowrap; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tbl .act { text-align: right; white-space: nowrap; width: 1%; }
  .tbl input.inline { width: 120px; padding: 6px 10px; text-align: right; }
  .tbl .sel { width: 36px; padding-right: 0; }
  .tbl .sel input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .bulkbar { position: sticky; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--accent);
    border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .bulkbar strong { margin-right: 6px; }
  .bulkbar select, .bulkbar input { padding: 6px 10px; font-size: 13.5px; }
  .extra { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-top: 14px; }
  .extra h3 { font-size: 14px; margin: 0 0 10px; }
  .rulegroup summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; }
  .rulegroup summary::-webkit-details-marker { display: none; }
  .rulegroup[open] summary { border-bottom: 1px solid var(--line); }
  .editor-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .editor-row .x { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

  /* ---------- Drawer, dialog, toast ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(20, 20, 18, .28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--bg); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .24s ease; z-index: 21; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }

  .drawer header h2 { margin: 0; font-size: 18px; font-weight: 600; }

  .drawer footer { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 26px; border-top: 1px solid var(--line); background: var(--bg); }
  .drawer footer .grow { flex: 1; }
  .split { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 4px; margin-bottom: 14px; }
  .split .split-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 600; font-size: 13px; }
  .form-err { background: var(--faint); color: var(--spend); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 13.5px; }
  .hint { font-size: 12px; color: var(--muted); margin: -8px 0 14px; }
  dialog { border: 1px solid var(--line); border-radius: 18px; padding: 24px; background: var(--panel); color: var(--text); max-width: 400px; box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(20, 20, 18, .3); }
  dialog h3 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 0 0 20px; color: var(--muted); }
  dialog .btns { display: flex; justify-content: flex-end; gap: 10px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 13.5px; opacity: 0; transition: all .2s; z-index: 40; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .login form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 34px 30px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .login p { margin: 0 0 24px; color: var(--muted); font-size: 13.5px; }
  .login .btn { width: 100%; justify-content: center; padding: 10px; margin-top: 6px; }

  /* ---------- Motion & snappiness ---------- */
  .btn, .round, .nav a, .tbl tr.click td, .seg button { transition: background .12s, border-color .12s, transform .08s, opacity .12s; }
  .btn:active, .round:active, .fab:active { transform: scale(.97); }
  #view.enter > * { animation: fadeUp .22s ease both; }
  #view.enter .cards > * { animation: fadeUp .28s ease both; }
  #view.enter .cards > :nth-child(2) { animation-delay: .03s; } #view.enter .cards > :nth-child(3) { animation-delay: .06s; }
  #view.enter .cards > :nth-child(4) { animation-delay: .09s; } #view.enter .cards > :nth-child(n+5) { animation-delay: .12s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .sk { background: linear-gradient(90deg, var(--faint) 25%, var(--line) 50%, var(--faint) 75%); background-size: 200% 100%; border-radius: 8px; animation: shimmer 1.1s infinite linear; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .drawer { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .tbl, .cards > .panel { contain: layout paint; }
  .attention { border-color: var(--warn); }
  .attention .row .name { white-space: normal; }
  .offline { padding-top: calc(6px + env(safe-area-inset-top, 0px)) !important; position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: var(--warn); color: #111; text-align: center; font-size: 13px; padding: 6px 12px; }
  /* ---------- Floating add button ---------- */
  .fab { position: fixed; right: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent);
    font-size: 28px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); z-index: 15; }
  .fab:hover { filter: brightness(1.08); }
  /* ---------- Undo toast ---------- */
  .undo { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 99px; padding: 8px 8px 8px 18px;
    display: flex; gap: 14px; align-items: center; z-index: 41; font-size: 13.5px; box-shadow: var(--shadow); }
  .undo button { background: var(--bg); color: var(--text); border: 0; border-radius: 99px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
  .undo .bar { position: absolute; left: 18px; right: 18px; bottom: 3px; height: 2px; background: var(--bg); opacity: .4; transform-origin: left; animation: drain 5s linear forwards; border-radius: 2px; }
  @keyframes drain { to { transform: scaleX(0); } }
  /* ---------- Chart tooltip ---------- */
  .tip { position: fixed; z-index: 45; pointer-events: none; background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.5; box-shadow: var(--shadow); }
  .flowchart .hit:hover { fill: var(--faint); fill-opacity: .5; }
  .chart .pt { cursor: default; }
  .chart .pt .dot { transition: r .1s; }
  .chart .pt:hover .dot { r: 6.5; }
  .tip { white-space: pre-line; max-width: 320px; }
  /* ---------- Command palette ---------- */
  .palette { position: fixed; inset: 0; background: rgba(20,20,18,.35); z-index: 50; display: grid; justify-items: center; align-items: start; padding-top: 12vh; }
  .palette-box { width: min(620px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; animation: fadeUp .14s ease both; }
  .palette-box input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 18px 20px; font-size: 16px; background: transparent; }
  .pal-list { max-height: 52vh; overflow-y: auto; padding: 6px; }
  .pal-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
  .pal-item .k { font-size: 12px; color: var(--muted); }
  .pal-item.on { background: var(--faint); box-shadow: inset 3px 0 0 var(--accent); }
  .pal-foot { display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  /* ---------- Date picker ---------- */
  input[type=date]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
  .calpop { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; width: 270px; animation: fadeUp .12s ease both; }
  .calpop .ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .calpop .ch button { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 2px 8px; border-radius: 8px; }
  .calpop .ch button:hover { background: var(--faint); color: var(--text); }
  .calpop .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .calpop .dow { font-size: 11px; color: var(--muted); padding: 4px 0; }
  .calpop .d { border: 0; background: none; padding: 7px 0; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .calpop .d:hover { background: var(--faint); }
  .calpop .d.out { color: var(--muted); opacity: .5; }
  .calpop .d.today { box-shadow: inset 0 0 0 1px var(--accent); }
  .calpop .d.sel { background: var(--accent); color: var(--on-accent); }
  .calpop .cf { display: flex; justify-content: space-between; margin-top: 8px; }
  /* ---------- Phone tab bar ---------- */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; background: var(--panel); border-top: 1px solid var(--line);
    display: none; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a, .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .tabbar a.on { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; }
  .fab { display: grid; place-items: center; padding: 0; }
  .fab svg { width: 26px; height: 26px; }
  .tabbar .plus svg { width: 24px; height: 24px; }
  .tabbar .plus { width: 46px; height: 46px; margin: -18px auto 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 26px; box-shadow: var(--shadow); padding: 0; display: grid; place-items: center; }
  .tbl tr.swiping td { transition: none; }
  .tbl tr.swipe-del td { background: color-mix(in srgb, var(--spend) 18%, var(--panel)); }
  /* ---------- Grouped transaction feed ---------- */
  .panel.flush { overflow: clip; }
  /* Rows are grids and each day is its own block, so a day's header pushes the previous one away while scrolling */
  .tbl.feed { contain: none; display: block; --cols: minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(110px, auto); }
  .tbl.feed.has-sel { --cols: 44px minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(110px, auto); }
  .tbl.feed tbody.day { display: block; }
  .tbl.feed tr { display: grid; grid-template-columns: var(--cols); }

  .tbl.feed tr.dayhead td { padding: 0; border-bottom: 1px solid var(--line); background: transparent; }
  .tbl.feed tr.dayhead div { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted);
    background: color-mix(in srgb, color-mix(in srgb, var(--faint) 60%, var(--panel)) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tbl.feed tr.dayhead .num { font-weight: 500; }
  .tbl.feed tr.dayhead .num.pos { color: var(--good); }
  .tbl.feed tbody.day:not(:first-child) tr.dayhead div { box-shadow: inset 0 1px 0 var(--line); }
  .tbl.feed tbody.day tr:last-child td { border-bottom: none; }
  .tbl.feed td { padding-top: 11px; padding-bottom: 11px; }
  .txmain { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .txmain .txt { min-width: 0; }
  .txmain .desc { overflow: hidden; text-overflow: ellipsis; }
  .tbl.feed .meta { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: center; margin-top: 2px; }
  .cat-s { display: none; font-size: 12.5px; color: var(--muted); margin-right: 8px; }
  .tbl.feed .catcol { color: var(--muted); font-size: 13.5px; }
  .av { --h: 220; --c: hsl(var(--h) 62% 48%); flex: none; width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 13px; font-weight: 650; letter-spacing: -.02em; line-height: 1;
    background: color-mix(in oklab, var(--c) 17%, var(--panel)); color: color-mix(in oklab, var(--c) 62%, var(--text));
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 22%, transparent); }
  .av.xfer { --c: var(--muted); }
  .av svg { width: 17px; height: 17px; }
  .av.lg { width: 52px; height: 52px; font-size: 19px; }
  .av.lg svg { width: 24px; height: 24px; }
  .selall { margin: 0 0 0 auto; font-size: 13px; color: var(--muted); }
  .nm { display: inline-block; }
  .head h1 { width: fit-content; }
  /* ---------- Drawer hero ---------- */
  .drawer header { align-items: flex-start; }
  .dhero { display: flex; gap: 14px; align-items: center; min-width: 0; }
  .dhero .eyebrow { margin-bottom: 1px; }
  .dhero h2 { font-size: 19px !important; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
  .dh-txt { min-width: 0; }
  /* ---------- Insight cards ---------- */
  main#view { min-width: 0; }
  .insights { min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; margin: -14px 0 24px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; padding: 2px; }
  .insights::-webkit-scrollbar { display: none; }
  .insight { --tone: var(--muted); position: relative; scroll-snap-align: start; display: flex; gap: 12px; align-items: flex-start; text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 36px 14px 14px; transition: border-color .15s, transform .15s; }
  .insight:hover { border-color: color-mix(in srgb, var(--tone) 55%, var(--line)); transform: translateY(-1px); }
  .insight.t-up { --tone: var(--spend); } .insight.t-down { --tone: var(--good); } .insight.t-warn { --tone: var(--warn); }
  .insight .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, var(--panel)); }
  .insight .ic svg { width: 18px; height: 18px; }
  .insight .t { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .insight .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
  .insight .x { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; opacity: 0; transition: opacity .15s, background .15s; }
  .insight:hover .x, .insight .x:focus-visible { opacity: 1; }
  .insight .x:hover { background: var(--faint); color: var(--text); }
  @media (hover: none) { .insight .x { opacity: .7; } }
  /* ---------- Part 2: widgets, sheets, pickers, charts ---------- */
  .cards > .w { break-inside: avoid; display: inline-block; width: 100%; margin-bottom: 20px; vertical-align: top; }
  .cards > .w > .panel { contain: layout paint; }
  .cards > .w.wide { column-span: all; display: block; }
  .dash-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px dashed var(--accent); border-radius: 14px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
  .dash-bar .grow, .wctl .grow { flex: 1; }
  .cards.editing > .w { position: relative; border-radius: var(--radius); outline: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; cursor: grab; }
  .cards.editing > .w > :not(.wctl) { pointer-events: none; }

  .cards.editing > .w.dragging { opacity: .4; }
  .wctl { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12.5px; }

  .wctl button:hover { border-color: var(--muted); }
  .row .spark { flex: none; margin-left: auto; margin-right: 12px; align-self: center; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .spark circle { fill: var(--muted); }
  .spark.good polyline { stroke: var(--good); } .spark.good circle { fill: var(--good); }
  .spark.bad polyline { stroke: var(--spend); } .spark.bad circle { fill: var(--spend); }
  .hm { display: grid; gap: 6px; }
  .hm-dow, .hm-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .hm-dow span { text-align: center; font-size: 11px; color: var(--muted); }
  .hm-cell { aspect-ratio: 1; border-radius: 8px; border: 0; padding: 0; font-size: 11px; color: var(--muted); display: grid; place-items: center; cursor: pointer;
    background: color-mix(in srgb, var(--spend) var(--p, 0%), var(--faint)); transition: transform .12s; }

  .hm-cell:disabled { cursor: default; }
  .hm-cell.pad { background: none; }
  .hm-cell.fut { background: none; box-shadow: inset 0 0 0 1px var(--line); opacity: .6; }
  .hm-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .hm-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .sankey svg { width: 100%; height: auto; display: block; }
  .sankey .lk { fill-opacity: .26; transition: fill-opacity .15s; }
  .sankey .lk:hover { fill-opacity: .55; }
  .sankey .sk-name { fill: var(--text); font-size: 12.5px; font-weight: 500; }
  .sankey .sk-amt { fill: var(--muted); font-size: 11.5px; }
  .tbl.feed .inl { cursor: pointer; border-radius: 6px; transition: background .12s, box-shadow .12s; }
  .tbl.feed .catcol .inl { padding: 3px 7px; margin-left: -7px; }
  .tbl.feed .inl:hover { background: var(--faint); box-shadow: 0 0 0 1px var(--line); color: var(--text); }
  .chip.ghost { background: none; box-shadow: inset 0 0 0 1px dashed var(--line); border: 1px dashed var(--line); opacity: 0; }
  .tbl.feed tr:hover .chip.ghost, .tbl.feed tr.kfocus .chip.ghost { opacity: 1; }
  @media (hover: none) { .chip.ghost { display: none; } }
  .tbl.feed tr[data-gid] { scroll-margin: 48px 0 90px; }
  .tbl.feed tr.kfocus td { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  .tbl.feed tr.kfocus td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .tbl.feed tr.saving { opacity: .55; }

  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pickpop { position: fixed; z-index: 62; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: fadeUp .12s ease both; }
  .pickpop input { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 11px 14px; background: transparent; }
  .pickpop .pk-list { max-height: 260px; overflow-y: auto; padding: 4px; }
  .pickpop .pal-item { padding: 8px 12px; }
  kbd { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel); color: var(--text); }
  .toggles { display: grid; gap: 2px; margin: 4px 0 6px; }

  .ptr { position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; z-index: 30; width: 40px; height: 40px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center;

  /* ---------- Theme: Liquid glass neon ---------- */
  html[data-theme="glass"] { --bg: #07060f; --panel: rgba(24, 20, 48, .52); --line: rgba(255, 255, 255, .13); --text: #f5f3ff; --muted: #aaa4cc; --faint: rgba(255, 255, 255, .07);
    --good: #3dffb5; --spend: #ff4fd8; --income: #37f5ff; --warn: #ffd84d; --accent: #37f5ff; --on-accent: #04121a;
    --hero-grad: linear-gradient(90deg, #37f5ff, #b86bff 50%, #ff4fd8); --shadow: 0 20px 60px rgba(0, 0, 0, .55); --radius: 22px; color-scheme: dark;
    --glass: linear-gradient(150deg, rgba(255,255,255,.11), rgba(255,255,255,.035) 42%, rgba(255,255,255,.06));
    --glass-edge: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.05), inset 1px 0 0 rgba(255,255,255,.06);
    background: #07060f; }
  html[data-theme="glass"] body { background: transparent; }
  /* drifting neon light behind the glass */
  html[data-theme="glass"] body::after { content: ''; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38vmax 38vmax at 18% 22%, rgba(255, 79, 216, .42), transparent 62%),
      radial-gradient(42vmax 42vmax at 82% 30%, rgba(55, 245, 255, .30), transparent 60%),
      radial-gradient(46vmax 46vmax at 55% 88%, rgba(140, 92, 255, .40), transparent 62%),
      radial-gradient(30vmax 30vmax at 90% 85%, rgba(61, 255, 181, .16), transparent 60%);
    filter: saturate(130%); animation: glassDrift 38s ease-in-out infinite alternate; will-change: transform; }
  @keyframes glassDrift { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(4vmax, -3vmax, 0) rotate(8deg); } 100% { transform: translate3d(-3vmax, 3vmax, 0) rotate(-6deg); } }
  /* frosted surfaces */
  html[data-theme="glass"] :is(.panel, .kpi, .insight, .extra, .split, .login form, .dash-bar) {
    background: var(--glass), rgba(20, 16, 42, .38); border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: var(--glass-edge), 0 12px 40px rgba(0, 0, 0, .35);

  html[data-theme="glass"] :is(.drawer, dialog, .calpop, .pickpop, .palette-box, .bulkbar) {
    background: var(--glass), rgba(14, 11, 30, .72); border-color: rgba(255, 255, 255, .16);

  html[data-theme="glass"] .drawer { box-shadow: var(--glass-edge), -20px 0 80px rgba(0, 0, 0, .5); }

  html[data-theme="glass"] :is(input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea, .btn, .round, .wctl button) {

  html[data-theme="glass"] :is(input, select, textarea):focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(55, 245, 255, .18), 0 0 18px rgba(55, 245, 255, .25); }
  html[data-theme="glass"] .seg { background: rgba(255, 255, 255, .06); }

  html[data-theme="glass"] .side { border-right-color: rgba(255, 255, 255, .08); background: rgba(10, 8, 22, .35); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  /* neon glow */
  html[data-theme="glass"] .btn.primary, html[data-theme="glass"] .fab, html[data-theme="glass"] .tabbar .plus {
    background: linear-gradient(135deg, #37f5ff, #8b5cff); border-color: transparent; color: #05101a; box-shadow: 0 0 22px rgba(55, 245, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .5); }
  html[data-theme="glass"] .nav a.on { background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 0 0 1px rgba(255, 255, 255, .1); }

  html[data-theme="glass"] .av { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 0 0 1px color-mix(in oklab, var(--c) 35%, transparent), 0 0 14px color-mix(in oklab, var(--c) 30%, transparent); }
  html[data-theme="glass"] .appbar.scrolled { background: rgba(10, 8, 24, .45); }

  @media (prefers-reduced-motion: reduce) { html[data-theme="glass"] body::after { animation: none; } }
  /* Moving light under blurred glass makes the browser re-blur every card on every frame. Pause it while scrolling,
     and use a lighter blur on phones, so scrolling stays smooth. */
  html.scrolling[data-theme="glass"] body::after { animation-play-state: paused; }
  @media (max-width: 900px) {
    html[data-theme="glass"] :is(.panel, .kpi, .insight, .extra, .split, .dash-bar) { -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }

  /* ---------- iPhone: notch / home bar, no accidental zoom, native-app shell ---------- */
  body { touch-action: manipulation; }
  body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); z-index: 19; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  html.native { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

  @media (max-width: 900px) {

    .drawer { max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 12px); }
  }
  /* ---------- App shell (iPhone app / Home Screen): iOS title bar, sheets, touch feel ---------- */
  .appbar { display: none; }
  @media (max-width: 900px) {
    html.shell .appbar { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 18; height: calc(env(safe-area-inset-top, 0px) + 44px);
      padding: env(safe-area-inset-top, 0px) 70px 0; align-items: center; justify-content: center; pointer-events: none; transition: background-color .2s, box-shadow .2s; }
    html.shell .appbar.scrolled { background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
      box-shadow: 0 .5px 0 color-mix(in srgb, var(--text) 18%, transparent); }
    html.shell .ab-title { font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    html.shell .appbar.scrolled .ab-title { opacity: 1; transform: none; }
    html.shell .ab-back { position: absolute; left: 4px; bottom: 0; height: 44px; display: flex; align-items: center; gap: 3px; padding: 0 10px 0 6px; color: var(--accent);

    html.shell body::before { display: none; }

  /* Touch: iOS-style press feedback instead of mouse hover effects */
  @media (hover: none) {

  /* Push / pop page transitions (like navigating in an iOS app) */
  html[data-vtdir="push"]::view-transition-old(page) { animation: vtPushOut .4s cubic-bezier(.2,.9,.25,1) both; }
  html[data-vtdir="push"]::view-transition-new(page) { animation: vtPushIn .4s cubic-bezier(.2,.9,.25,1) both; }
  html[data-vtdir="pop"]::view-transition-old(page) { animation: vtPopOut .34s cubic-bezier(.3,.8,.3,1) both; z-index: 2; }
  html[data-vtdir="pop"]::view-transition-new(page) { animation: vtPopIn .34s cubic-bezier(.3,.8,.3,1) both; }
  @keyframes vtPushIn { from { transform: translateX(100%); } }
  @keyframes vtPushOut { to { transform: translateX(-28%); opacity: .6; } }
  @keyframes vtPopIn { from { transform: translateX(-28%); opacity: .6; } }
  @keyframes vtPopOut { to { transform: translateX(100%); } }
  /* ---------- View Transitions ---------- */
  ::view-transition-group(*) { animation-duration: .32s; animation-timing-function: cubic-bezier(.2,.8,.2,1); }
  html.vt-page #view { view-transition-name: page; }
  ::view-transition-old(page) { animation: vtFadeOut .14s ease both; }
  ::view-transition-new(page) { animation: vtFadeUp .26s cubic-bezier(.2,.8,.2,1) both; }
  html[data-vtdir="next"]::view-transition-old(page) { animation: vtOutLeft .2s ease both; }
  html[data-vtdir="next"]::view-transition-new(page) { animation: vtInRight .3s cubic-bezier(.2,.8,.2,1) both; }
  html[data-vtdir="prev"]::view-transition-old(page) { animation: vtOutRight .2s ease both; }
  html[data-vtdir="prev"]::view-transition-new(page) { animation: vtInLeft .3s cubic-bezier(.2,.8,.2,1) both; }
  ::view-transition-old(ptitle), ::view-transition-new(ptitle) { height: 100%; width: auto; object-fit: contain; object-position: left center; }
  ::view-transition-group(ptitle) { animation-duration: .36s; z-index: 2; }
  html.vt-drawer-open .drawer, html.vt-drawer-close .drawer { view-transition-name: drawer; transition: none; }
  html.vt-drawer-open .scrim, html.vt-drawer-close .scrim { view-transition-name: scrim; transition: none; }
  html.vt-drawer-open::view-transition-old(drawer) { display: none; }

  html.vt-drawer-close::view-transition-old(drawer) { animation: vtOutDrawer .26s cubic-bezier(.4,0,.6,1) both; }
  ::view-transition-group(txav) { animation-duration: .38s; z-index: 5; }
  ::view-transition-old(txav), ::view-transition-new(txav) { height: 100%; width: 100%; }
  ::view-transition-old(txav) { animation: vtFadeOut .12s ease both; }
  ::view-transition-new(txav) { animation: none; }
  html.vt-theme::view-transition-old(root), html.vt-theme::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  html.vt-theme::view-transition-group(root) { animation-duration: .52s; }
  @keyframes vtFadeOut { to { opacity: 0; } }

  @media print {

<body>

<div id="login" class="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Money</h1>
    <p>Enter the dashboard password to continue.</p>
    <div id="loginErr" class="form-err" hidden></div>
    <input type="text" name="username" value="money" autocomplete="username" hidden>
    <label>Password<input type="password" id="loginPw" autocomplete="current-password" required autofocus></label>
    <label class="check"><input type="checkbox" id="loginRemember" checked> Keep me signed in on this computer</label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand">Money</div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="foot">
      <div class="label">Theme</div>
      <div class="themes" id="themes"></div>
      <div class="toggles"><button type="button" data-tg="privacy" onclick="App.togglePrivacy()"></button><button type="button" data-tg="compact" onclick="App.toggleDensity()"></button></div>
      <a id="ffLink" href="${FIREFLY_URL}" target="_blank" rel="noopener">Open Firefly III ↗</a>
      <button type="button" onclick="App.signOut()">Sign out</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<button id="fab" class="fab" type="button" onclick="App.quickAdd()" aria-label="Add transaction (N)" title="Add transaction (N)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="palette" class="palette" hidden onclick="if(event.target===this)App.closePalette()">
  <div class="palette-box"><input id="palQ" type="text" placeholder="Jump to a page, account, budget… or type to search transactions" autocomplete="off"
    oninput="App.palFilter()" onkeydown="App.palKey(event)"><div id="palList" class="pal-list"></div>

async function api(path, opt = {}) {

/* ================= Loan progress ================= */
// Original amount = opening balance + everything borrowed from the loan (money flowing out of it);
// repaid = everything paid into it. Works whether the loan was set up with an opening balance or a deposit.
async function loanProgress(loans) {
  const out = {};
  await Promise.all(loans.map(async l => {
    try {
      const groups = (await getAll('/accounts/' + l.id + '/transactions')).map(normGroup);
      let borrowed = Math.abs(l.opening), repaid = 0;
      groups.forEach(g => g.splits.forEach(s => {
        if (s.type === 'opening balance') return;          // already counted via the opening balance
        if (s.source_id === l.id) borrowed += s.amount;
        else if (s.destination_id === l.id) repaid += s.amount;
      }));
      out[l.id] = { borrowed, repaid, pct: borrowed > 0 ? Math.min(100, Math.max(0, repaid / borrowed * 100)) : null };

}

/* ================= Transactions: normalize ================= */

  }));

/* ---------- Merchant avatars ---------- */

function payeeOf(g) {

// Replace only the placeholders and the cards that changed, so the numbers already on screen don't redraw.
function fillIn(html) {
  const v = el('view'), t = document.createElement('template'); t.innerHTML = html;
  const olds = [...v.querySelectorAll('#dash > .w')], news = [...t.content.querySelectorAll('#dash > .w')];
  if (olds.map(w => w.dataset.w).join() !== news.map(w => w.dataset.w).join()) return false;      // a card came or went: redraw it all
  const insOld = v.querySelector('#insights'), insNew = t.content.querySelector('#insights');
  if (insOld) insNew ? insOld.replaceWith(insNew) : insOld.remove();
  olds.forEach((o, i) => { if (news[i].innerHTML !== o.innerHTML) o.replaceWith(news[i]); });
  S.pageHtml = html;
  bindSwipe();
  return true;
}

function cashFlow(trend) {
  const W = window.innerWidth < 600 ? 420 : 960, H = 210, top = 10, bottom = 28, n = trend.length;
  const max = Math.max(1, ...trend.flatMap(t => [t.income, t.spend])), slot = W / n, bw = Math.min(34, slot / 4);
  const yy = v => top + (H - top - bottom) * (1 - v / max);
  const bars = trend.map((t, i) => {
    const cx = slot * i + slot / 2;
    return '<rect class="hit" x="' + (slot * i) + '" y="0" width="' + slot + '" height="' + H + '" fill="transparent" data-i="' + i + '"' + (t.go ? ' data-go="' + t.go + '" style="cursor:pointer"' : '') + '></rect>' +
      '<rect data-i="' + i + '" x="' + (cx - bw - 3) + '" y="' + yy(t.income) + '" width="' + bw + '" height="' + (H - bottom - yy(t.income)) + '" rx="6" fill="var(--income)" style="color:var(--income)' + (t.go ? ';cursor:pointer' : '') + '"><title>Earned ' + money0(t.income) + '</title></rect>' +
      '<rect data-i="' + i + '" x="' + (cx + 3) + '" y="' + yy(t.spend) + '" width="' + bw + '" height="' + (H - bottom - yy(t.spend)) + '" rx="6" fill="var(--spend)" style="color:var(--spend)' + (t.go ? ';cursor:pointer' : '') + '" opacity=".85"><title>Spent ' + money0(t.spend) + '</title></rect>' +
      '<text x="' + cx + '" y="' + (H - 7) + '" text-anchor="middle">' + esc(t.label) + '</text>';
  }).join('');
  const avgS = trend.reduce((s, t) => s + t.spend, 0) / n, avgK = trend.reduce((s, t) => s + t.income - t.spend, 0) / n;
  S.chartData = trend;

    '<line x1="0" x2="' + W + '" y1="' + (H - bottom) + '" y2="' + (H - bottom) + '" stroke="var(--line)"/>' + bars + '</svg>' +
    '<div style="display:flex;gap:40px;margin-top:18px"><div><div class="eyebrow">Avg. spent / month</div><div class="num" style="font-size:21px">' + money0(avgS) + '</div></div>' +
    '<div><div class="eyebrow">Avg. kept / month</div><div class="num" style="font-size:21px">' + money0(avgK) + '</div></div></div>' +
    '<div class="legend"><span><i style="background:var(--income)"></i>Earned</span><span><i style="background:var(--spend)"></i>Spent</span></div>';
}

function resolveCounter(name, kind) {

function buildTxPayload() {
  const f = S.form, edit = !!f.id;
  const txs = f.splits.map(s => {
    const o = { type: f.type, date: f.date, amount: String(Math.abs(num(s.amount))), description: s.description.trim() };
    if (edit && s.jid) o.transaction_journal_id = s.jid;
    const changed = k => !edit || !s.jid || String(s[k] || '') !== String((s.orig || {})[k] || '');
    if (f.type === 'withdrawal') {
      o.source_id = f.main;
      if (s.counter.trim()) { const c = resolveCounter(s.counter, 'withdrawal'); c.id ? (o.destination_id = c.id) : (o.destination_name = c.name); }
      if (changed('budget')) o.budget_id = s.budget || '0';
      if (changed('bill')) o.bill_id = s.bill || '0';
    } else if (f.type === 'deposit') {
      o.destination_id = f.main;
      if (s.counter.trim()) { const c = resolveCounter(s.counter, 'deposit'); c.id ? (o.source_id = c.id) : (o.source_name = c.name); }
    } else {
      o.source_id = f.src; o.destination_id = f.dst;

    if (changed('notes')) o.notes = s.notes;
    if (changed('fa') || changed('fc')) {

async function saveTx(formEl) {
  collectTx();

  if (f.type === 'transfer') {
    if (!f.src || !f.dst) return formError('Choose both accounts for the transfer.');
    if (f.src === f.dst) return formError('A transfer needs two different accounts.');
  } else if (!f.main) return formError('Choose the account.');
  for (const s of f.splits) {
    if (s.fa && num(s.fa) > 0 && !s.fc) return formError('Pick the currency for the foreign amount.');
    if (!s.description.trim()) return formError('Every part needs a description.');
    if (!(num(s.amount) > 0)) return formError('Every part needs an amount above zero.');
  }

  const body = buildTxPayload(), row = f.id && document.querySelector('#view tr[data-gid="' + f.id + '"]');
  closeDrawer();
  if (row) {
    row.classList.add('saving');
    const d = row.querySelector('.desc'); if (d && f.splits.length === 1) d.textContent = f.splits[0].description;
    const a = row.querySelector('.amt'); if (a && f.splits.length === 1 && f.type !== 'transfer') a.textContent = (f.type === 'deposit' ? '+' : '-') + money(num(f.splits[0].amount)).replace('-', '');

function balanceChart(groups, a, range) {

  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / span);
  let path = '';
  pts.forEach((p, i) => { path += (i ? ' H' + x(i).toFixed(1) + ' V' : 'M' + x(i).toFixed(1) + ' ') + y(p.v).toFixed(1); });
  const tip = p => { const ch = owed ? -p.amt : p.amt; return fmtDate(p.d) + '\n' + p.desc + '\n' + (ch > 0 ? '+' : '') + money(ch) + '  →  ' + money(p.v) + (owed ? ' owed' : ''); };
  const dots = pts.map((p, i) => '<g class="pt" data-tip="' + esc(tip(p)) + '"><circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (n > 150 ? 6 : 11) + '" fill="transparent"/>' +
    (n <= 150 ? '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3.5" fill="var(--good)"/>' : '') + '</g>').join('');
  const zero = lo < 0 && hi > 0 ? '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)" stroke-dasharray="4 4"/>' : '';
  const fd = long ? fmtDate : fmtDay;
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Balance over time">' + zero +
    '<path d="' + path + '" fill="none" stroke="var(--good)" stroke-width="2"/>' + dots +
    '<text x="' + pl + '" y="' + (H - 6) + '">' + fd(pts[0].d) + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + fd(pts[n - 1].d) + '</text>' +
    '<text x="' + pl + '" y="14">' + (owed ? 'Highest owed ' : 'High ') + money0(hi) + '</text></svg>';
}

async function saveAccount() {
  const { kind, id } = S.form, v = x => el(x) ? el(x).value.trim() : '';
  const b = { name: v('a-name'), notes: v('a-notes') };
  if (!b.name) return formError('Give the account a name.');
  if (kind === 'asset') { b.type = 'asset'; b.account_role = v('a-role'); b.account_number = v('a-number'); }
  if (kind === 'card') { b.type = 'asset'; b.account_role = 'ccAsset'; b.credit_card_type = 'monthlyFull'; b.monthly_payment_date = v('a-paydate'); }
  if (kind === 'liability') {
    b.type = 'liability'; b.liability_type = v('a-ltype'); b.liability_direction = 'credit'; b.interest = v('a-interest') || '0'; b.interest_period = v('a-iperiod');
    const day = parseInt(v('a-pday'), 10);
    if (v('a-pday') && !(day >= 1 && day <= 31)) return formError('The due day must be between 1 and 31.');
    b.notes = withPlan(b.notes, { amount: num(v('a-pamt')), day: day || null, from: v('a-pfrom') });
  }
  if (kind === 'expense' || kind === 'revenue') b.type = kind;
  if (id && el('a-open') && v('a-open') !== '') {
    const amt = Math.abs(num(v('a-open')));
    b.opening_balance = String(kind === 'card' || kind === 'liability' ? -amt : num(v('a-open')));
    b.opening_balance_date = v('a-opendate') || todayIso();
  }
  if (!id && el('a-open') && v('a-open') !== '') {
    const amt = Math.abs(num(v('a-open')));
    // Credit-card and loan balances are stored in Firefly as negative numbers (money owed).
    b.opening_balance = String(kind === 'card' || kind === 'liability' ? -amt : num(v('a-open')));
    b.opening_balance_date = v('a-opendate') || todayIso();
  }
  if (!id) b.currency_code = S.currency;
  if (id) { b.active = el('a-active').checked; if (el('a-networth')) b.include_net_worth = el('a-networth').checked; delete b.type; }
  await busy(el('accSave'), async () => {
    const res = id ? await api('/accounts/' + id, { method: 'PUT', body: b }) : await api('/accounts', { method: 'POST', body: b });
    invalidate(); closeDrawer(); toast(id ? 'Account saved' : 'Account created');
    if (!id && res && res.data) location.hash = '#/account/' + res.data.id; else route();
  });
}
async function deleteAccount(id) {
  if (!await confirmBox('Delete this account?', 'Firefly III will also delete every transaction that uses this account. This cannot be undone. To keep the history, uncheck "Active" instead.')) return;
  try { await api('/accounts/' + id, { method: 'DELETE' }); invalidate(); closeDrawer(); toast('Account deleted'); location.hash = '#/accounts'; }
  catch (e) { formError(e.message); }
}

async function budgetLimits(cur, L) {
  const out = {};
  const take = (bid, x) => { const at = x.attributes || {}; out[String(bid)] = { id: String(x.id), amount: num(at.amount) }; };
  try {
    const all = await getAll('/budget-limits', { start: cur.start, end: cur.end });
    all.forEach(x => take(x.attributes.budget_id, x));
  } catch (e) {
    await Promise.all(L.budgets.map(b => getAll('/budgets/' + b.id + '/limits', { start: cur.start, end: cur.end }).then(ls => ls.forEach(x => take(b.id, x))).catch(() => {})));
  }
  return out;
}

      '<td class="amt">' + money(b.spent) + '</td>' +

      '<td class="act"><button class="btn small" onclick="App.budgetForm(\'' + b.id + '\')">Edit</button></td></tr>';
  }).join('');
  const inactiveCount = bs.filter(b => !b.active).length;
  paint(head('Budgets', 'Set how much you plan to spend each month', monthNav() + '<button class="btn primary" onclick="App.budgetForm()">+ New budget</button>') +
    '<div class="kpis">' + (available ? '<div class="kpi"><div class="eyebrow">Available to budget</div><div class="val num">' + money0(available) + '</div><div class="sub-s">' +
        (available - totLim >= 0 ? money0(available - totLim) + ' not yet assigned' : '<span class="up">' + money0(totLim - available) + ' more assigned than available</span>') + '</div></div>' : '') +
      '<div class="kpi"><div class="eyebrow">Budgeted</div><div class="val num">' + money0(totLim) + '</div></div>' +
      '<div class="kpi"><div class="eyebrow">Spent in budgets</div><div class="val num">' + money0(totSpent) + '</div></div>' +
      '<div class="kpi"><div class="eyebrow">Left</div><div class="val num ' + (totLim - totSpent < 0 ? 'neg' : '') + '">' + money0(totLim - totSpent) + '</div></div>' +

async function setLimit(bid, input) {
  const cur = monthRange(S.y, S.m), lim = (S.budgetLimits || {})[bid], val = input.value.trim();
  input.disabled = true;
  try {
    if (val === '' || num(val) <= 0) { if (lim) await api('/budgets/' + bid + '/limits/' + lim.id, { method: 'DELETE' }); }
    else if (lim) await api('/budgets/' + bid + '/limits/' + lim.id, { method: 'PUT', body: { amount: String(num(val)), start: cur.start, end: cur.end } });
    else await api('/budgets/' + bid + '/limits', { method: 'POST', body: { amount: String(num(val)), start: cur.start, end: cur.end, currency_code: S.currency } });
    toast('Budget updated'); route();
  } catch (e) { input.disabled = false; if (e instanceof AuthError) return showLogin(e.message); toast(e.message); }
}

async function saveBudget() {
  const id = S.form.id, name = el('b-name').value.trim();
  if (!name) return formError('Give the budget a name.');
  await busy(el('budSave'), async () => {
    const body = { name, notes: el('b-notes').value };
    const auto = el('b-auto').value, autoAmt = num(el('b-autoamt').value);
    if (auto !== 'none' && !(autoAmt > 0)) throw new Error('Set the monthly amount for the auto-budget.');
    body.auto_budget_type = auto;
    if (auto !== 'none') { body.auto_budget_amount = String(autoAmt); body.auto_budget_period = 'monthly'; body.auto_budget_currency_code = S.currency; }
    if (id) { body.active = el('b-active').checked; await api('/budgets/' + id, { method: 'PUT', body }); }
    else {
      const res = await api('/budgets', { method: 'POST', body: { ...body, active: true } });

      if (amt > 0 && res && res.data) await api('/budgets/' + res.data.id + '/limits', { method: 'POST', body: { amount: String(amt), start: cur.start, end: cur.end, currency_code: S.currency } });

  });
}

}

const THEMES = [

function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'auto'; }
function drawThemes() {
  el('themes').innerHTML = THEMES.map(([k, label, sw]) => '<button type="button" title="' + label + '" aria-label="' + label + ' theme" class="' + (k === currentTheme() ? 'on' : '') +

function setTheme(k) {

  }
}

window.addEventListener('hashchange', () => { const instant = S.tabNav; S.tabNav = false; if (!el('app').hidden) route({ nav: true, instant }); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && el('drawer').classList.contains('open') && !el('confirm').open) closeDrawer(); });

(async function boot() {
  S.key = storedKey();
  // Signed in before: show the data saved on this device right away, then refresh it in the background.
  if (S.key && S.remember) {
    try { (await PDB.loadAll()).forEach(([k, e]) => { if (e && e.t > Date.now() - 14 * 864e5 && !CACHE.has(k)) CACHE.set(k, e); }); } catch (e) { /* no saved data */ }
    if (CACHE.size) { S.bootStale = true; S.lastRefresh = Date.now(); showApp(); return; }
  }
  try { await api('/about'); showApp(); }
  catch (e) { if (e instanceof AuthError) showLogin(S.key ? 'Please sign in again.' : ''); else showApp(); }

function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');

  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b > 1024 ? Math.round(b / 1024) + ' KB' : (b || 0) + ' B';

function renderBulk(progress) {

  const n = S.sel ? S.sel.size : 0;

async function bulk(kind) {
  const groups = [...(S.sel || [])].map(id => S.txMeta[id] && S.txMeta[id].g).filter(Boolean);
  if (!groups.length) return;
  let val = '';
  if (kind === 'category') { val = el('bk-cat').value.trim(); if (!val) return toast('Type a category first.'); }
  if (kind === 'budget') { val = el('bk-bud').value; if (val === '') return toast('Choose a budget first.'); }
  if (kind === 'tag') { val = el('bk-tag').value.trim(); if (!val) return toast('Type a tag first.'); }
  if (kind === 'delete') return App.softDeleteTx(groups.map(g => g.id));
  let done = 0, skipped = 0, failed = 0, authErr = null;
  renderBulk('Working… 0 of ' + groups.length);
  await eachLimited(groups, 4, async g => {
    if (authErr) return;
    const tx = g.splits.map(s => {
      const o = { transaction_journal_id: s.jid };
      if (kind === 'category') o.category_name = val;
      if (kind === 'budget') { if (s.type !== 'withdrawal') return null; o.budget_id = val; }
      if (kind === 'tag') o.tags = [...new Set([...s.tags, val])];
      return o;
    }).filter(Boolean);
    if (!tx.length) skipped++;
    else {
      try { await api('/transactions/' + g.id, { method: 'PUT', body: { apply_rules: false, fire_webhooks: true, transactions: tx } }); }
      catch (e) { if (e instanceof AuthError) authErr = e; else failed++; }
    }
    renderBulk('Working… ' + (++done) + ' of ' + groups.length);
  });
  if (authErr) return showLogin(authErr.message);
  invalidate();
  toast('Updated ' + (done - skipped - failed) + ' transaction' + (done - skipped - failed === 1 ? '' : 's') +
    (skipped ? ' · ' + skipped + ' skipped (budgets only apply to expenses)' : '') + (failed ? ' · ' + failed + ' failed' : ''));
  route();
}

      Promise.all(jids.map(j => getAll('/transaction-journals/' + j + '/links').catch(() => []))).then(x => x.flat()),
      S.linkTypes ? Promise.resolve(S.linkTypes) : getAll('/link-types').then(t => (S.linkTypes = t)).catch(() => []),
    ]);
    const seen = new Set(), links = linksRaw.filter(l => !seen.has(l.id) && seen.add(l.id));
    const typeById = Object.fromEntries(types.map(t => [String(t.id), t.attributes]));
    const others = await Promise.all(links.map(l => {
      const at = l.attributes, mine = jids.includes(String(at.outward_id));

    box.innerHTML =

        (types.length ? '<div style="margin-top:12px"><div class="grid2"><label>This transaction…<select id="lnkType">' + dirOpts + '</select></label>' +
          '<label>…this one<input type="search" id="lnkQ" placeholder="Search description" onkeydown="if(event.key===\'Enter\'){event.preventDefault();App.findLink()}"></label></div>' +
          '<button class="btn small" type="button" onclick="App.findLink()">Find</button><div id="lnkResults" style="margin-top:10px"></div></div>' : '') +
      '</div>';
    S.extrasCtx = { gid, jids };
  } catch (e) { if (el('txExtras')) el('txExtras').innerHTML = '<p class="sub-s">' + esc(e.message) + '</p>'; }

VIEWS.reconcile = async (r, paint) => {
  await lists();
  const a = normAccount((await api('/accounts/' + r.id)).data);
  const end = r.q.end || todayIso(), start = r.q.start || end.slice(0, 8) + '01';
  const [before, txs] = await Promise.all([
    api('/accounts/' + r.id, { params: { date: addDays(start, -1) } }),
    getAll('/accounts/' + r.id + '/transactions', { start, end }),
  ]);
  const owed = isCard(a) || isLiab(a), disp = v => owed ? -v : v;
  const rows = [];
  txs.map(normGroup).forEach(g => g.splits.forEach(s => {
    if (s.source_id !== a.id && s.destination_id !== a.id) return;
    rows.push({ gid: g.id, jid: s.jid, date: s.date, desc: s.description, amt: s.source_id === a.id ? -s.amount : s.amount, rec: s.reconciled });
  }));
  rows.sort((x, y) => String(x.date).localeCompare(String(y.date)));
  if (!paint.live) return;
  S.rec = { a, rows, startBal: num(before.data.attributes.current_balance), owed, start, end, checked: new Set(rows.filter(x => x.rec).map(x => x.jid)) };
  paint('<p style="margin:0 0 6px"><a class="link" href="#/account/' + a.id + '">← ' + esc(a.name) + '</a></p>' +
    head('Reconcile ' + a.name, 'Tick off each transaction that appears on your statement until the difference is zero.', '') +
    '<section class="panel" style="margin-bottom:20px"><div class="grid2" style="grid-template-columns:repeat(3,1fr);gap:0 16px">' +
      '<label>Statement start<input type="date" id="rc-start" value="' + start + '" onchange="App.recDates()"></label>' +
      '<label>Statement end<input type="date" id="rc-end" value="' + end + '" onchange="App.recDates()"></label>' +
      '<label>' + (owed ? 'Statement balance owed' : 'Statement ending balance') + '<input type="number" step="0.01" id="rc-bal" value="' + esc(r.q.balance || '') + '" oninput="App.recCalc()" placeholder="From your statement"></label>' +
    '</div><div class="kpis" id="rc-kpis" style="margin:4px 0 0"></div><div id="rc-actions" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"></div></section>' +
    '<section class="panel flush">' + (rows.length ? '<table class="tbl"><thead><tr><th class="sel"><input type="checkbox" onchange="App.recAll(this.checked)" aria-label="Tick all"></th><th>Date</th><th>Description</th><th class="r">Amount</th></tr></thead><tbody>' +
      rows.map(x => '<tr><td class="sel"><input type="checkbox" data-rec="' + x.jid + '"' + (S.rec.checked.has(x.jid) ? ' checked' : '') + (x.rec ? ' disabled title="Already reconciled"' : '') + ' onchange="App.recTick(this)"></td>' +
        '<td class="date">' + fmtDay(x.date) + '</td><td class="desc">' + esc(x.desc) + (x.rec ? ' <span class="chip good">Reconciled</span>' : '') + '</td>' +
        '<td class="amt ' + (x.amt < 0 ? 'neg' : 'pos') + '">' + (x.amt > 0 ? '+' : '') + money(x.amt) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="center-empty">No transactions in this period.</div>') + '</section>');
  recCalc();
};
function recCalc() {
  const R = S.rec; if (!R) return;
  const disp = v => R.owed ? -v : v;
  const cleared = R.startBal + R.rows.filter(x => R.checked.has(x.jid)).reduce((s, x) => s + x.amt, 0);
  const raw = el('rc-bal').value.trim(), stmt = raw === '' ? null : (R.owed ? -num(raw) : num(raw));
  const diff = stmt === null ? null : Math.round((stmt - cleared) * 100) / 100;
  const newly = R.rows.filter(x => R.checked.has(x.jid) && !x.rec).length;
  el('rc-kpis').innerHTML =
    '<div class="kpi"><div class="eyebrow">Balance before ' + fmtDay(R.start) + '</div><div class="val num">' + money(disp(R.startBal)) + '</div></div>' +
    '<div class="kpi"><div class="eyebrow">Ticked balance</div><div class="val num">' + money(disp(cleared)) + '</div></div>' +
    '<div class="kpi"><div class="eyebrow">Difference</div><div class="val num ' + (diff === null ? '' : diff === 0 ? 'pos' : 'neg') + '">' + (diff === null ? '—' : diff === 0 ? 'Balanced ✓' : money(disp(diff))) + '</div></div>';
  el('rc-actions').innerHTML =
    '<button class="btn primary" onclick="App.recFinish()"' + (newly ? '' : ' disabled') + '>Mark ' + newly + ' as reconciled</button>' +
    (diff ? '<button class="btn" onclick="App.recAdjust()">Add a ' + money(Math.abs(diff)) + ' adjustment</button>' : '');
  R.diff = diff;
}
function recTick(cb) { cb.checked ? S.rec.checked.add(cb.dataset.rec) : S.rec.checked.delete(cb.dataset.rec); recCalc(); }
function recAll(on) { document.querySelectorAll('input[data-rec]:not(:disabled)').forEach(cb => { cb.checked = on; on ? S.rec.checked.add(cb.dataset.rec) : S.rec.checked.delete(cb.dataset.rec); }); recCalc(); }

async function recFinish() {
  const R = S.rec, todo = R.rows.filter(x => R.checked.has(x.jid) && !x.rec);
  if (R.diff && !await confirmBox('The difference isn’t zero', 'You can still mark the ticked transactions as reconciled, but the account won’t match the statement yet.', 'Mark anyway')) return;
  await withAuth(async () => {
    let n = 0;
    await eachLimited(todo, 4, async x => { await api('/transactions/' + x.gid, { method: 'PUT', body: { apply_rules: false, transactions: [{ transaction_journal_id: x.jid, reconciled: true }] } }); n++; });
    toast(n + ' transaction' + (n === 1 ? '' : 's') + ' reconciled'); route();
  });
}
async function recAdjust() {
  const R = S.rec, d = R.diff; if (!d) return;
  await lists();
  newTx({ type: d > 0 ? 'deposit' : 'withdrawal', account: R.a.id, amount: String(Math.abs(d)), description: 'Reconciliation adjustment', date: R.end });
}

async function saveRecur() {
  const f = S.form, v = x => el(x) ? el(x).value.trim() : '';

  if (!(num(v('rc-amount')) > 0)) return formError('Enter an amount above zero.');
  await busy(el('recSave'), async () => {
    const tx = { description: v('rc-desc') || v('rc-title'), amount: String(num(v('rc-amount'))), currency_code: S.currency };
    if (type === 'transfer') {
      if (!v('rc-src') || !v('rc-dst') || v('rc-src') === v('rc-dst')) throw new Error('Choose two different accounts.');
      tx.source_id = v('rc-src'); tx.destination_id = v('rc-dst');
    } else {
      if (!v('rc-main')) throw new Error('Choose the account.');
      if (!v('rc-counter')) throw new Error('Say who it is ' + (type === 'withdrawal' ? 'paid to.' : 'received from.'));
      const other = await accountIdFor(v('rc-counter'), type);

    }
    const cat = await categoryIdFor(v('rc-cat')); if (cat) tx.category_id = cat;

    const moment = freq === 'monthly' ? String(d.getDate()) : freq === 'weekly' ? String(d.getDay() || 7) : freq === 'yearly' ? first : '';
    const body = { type, title: v('rc-title'), first_date: first, apply_rules: el('rc-rules').checked, active: el('rc-active').checked, notes: el('rc-notes').value,
      repetitions: [{ type: freq, moment, skip: Math.max(0, parseInt(v('rc-every') || '1', 10) - 1), weekend: parseInt(v('rc-weekend'), 10) }], transactions: [tx] };

}

function reportRange(q) {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  const P = {
    'this-month': [monthRange(y, m).start, monthRange(y, m).end], 'last-month': [monthRange(y, m - 1).start, monthRange(y, m - 1).end],
    'last-3': [monthRange(y, m - 2).start, monthRange(y, m).end], 'this-year': [y + '-01-01', y + '-12-31'],
    'last-year': [(y - 1) + '-01-01', (y - 1) + '-12-31'], 'last-12': [monthRange(y, m - 11).start, monthRange(y, m).end],
  };
  if (q.start && q.end) return { start: q.start, end: q.end, preset: '' };
  const p = q.preset || 'this-month';
  return { start: P[p][0], end: P[p][1], preset: p };
}

async function currency(code, action) {

    catch (e) {
      if (action === 'primary') await api('/currencies/' + code + '/default', { method: 'POST' });
      else if (action === 'disable' && e.status === 409) return disableInUse(code);

// Firefly refuses (409) to disable a currency that anything still uses. Exchange rates are the usual
// culprit (Firefly adds a set of EUR rates itself), so offer to remove those and try again.
async function disableInUse(code) {

  if (!rates.length) {
    return confirmBox(code + ' is still in use', 'Firefly won’t disable ' + code + ' while an account, bill, budget, piggy bank or transaction uses it. Change those to another currency first.', 'OK');
  }
  if (!await confirmBox(code + ' is still in use', code + ' has ' + rates.length + ' exchange rate' + (rates.length === 1 ? '' : 's') + ', which stops Firefly from disabling it. Remove ' +

    await api('/currencies/' + code + '/disable', { method: 'POST' });

    if (e.status !== 409) throw e;
    await confirmBox(code + ' is still in use', 'The exchange rates are gone, but something else still uses ' + code + ' — an account, bill, budget, piggy bank or transaction. Change those first.', 'OK');
  }
  invalidate(); route();
}

<script>

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Prefetch a page's data when hovering its link ---------- */
const prefetched = {};
function prefetch(name) {
  if (!VIEWS[name] || name === (parseHash().name) || Date.now() - (prefetched[name] || 0) < 30000) return;
  prefetched[name] = Date.now();
  Promise.resolve().then(() => VIEWS[name]({ name, id: '', q: {} }, () => {})).catch(() => {});
}

/* ---------- After every page paint ---------- */
function afterPaint(r, o = {}) {

}
function countUp() {
  if (reduceMotion) return;
  document.querySelectorAll('#view [data-count]').forEach(node => {
    const target = parseFloat(node.dataset.count); if (!isFinite(target) || Math.abs(target) < 1) return;
    const t0 = performance.now(), dur = 520;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = money0(target * e);
      if (p < 1 && node.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function bindChart() {

    });

    svg.addEventListener('click', e => {
      const hit = e.target.closest && e.target.closest('[data-i]'); const d = hit && (S.chartData || [])[+hit.dataset.i];

      if (kind === 'report') location.hash = '#/reports?start=' + a + '&end=' + b;
    });

}

/* ---------- Hover tooltips for chart points ---------- */
document.addEventListener('mousemove', e => {
  const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null, tip = el('tip');
  if (!t) { if (tip.dataset.src === 'pt') { tip.hidden = true; tip.dataset.src = ''; } return; }
  tip.textContent = t.getAttribute('data-tip'); tip.dataset.src = 'pt'; tip.hidden = false;
  const w = tip.offsetWidth, hgt = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';

async function quickAdd() { await lists(); const r = parseHash(); newTx(r.name === 'account' && r.id ? { account: r.id } : {}); }
const typing = e => { const t = e.target; return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); };
document.addEventListener('keydown', e => {

    const s = mine.find(x => x.category) || mine[0];       // most recent one that was categorized

function score(label, q) {
  const l = label.toLowerCase();
  if (!q) return 1;
  if (l.startsWith(q)) return 100 - l.length / 100;
  const i = l.indexOf(q); if (i >= 0) return 60 - i;
  let j = 0; for (const ch of l) if (ch === q[j]) j++;   // letters in order, e.g. "cc" → "Capital one Credit card"
  return j === q.length ? 20 : 0;
}

    .sort((a, b) => b.s - a.s).slice(0, 40).map(x => x.it);

function palKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); palIdx = Math.min(palShown.length - 1, palIdx + 1); drawPal(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palIdx = Math.max(0, palIdx - 1); drawPal(); }
  else if (e.key === 'Enter') { e.preventDefault(); palRun(palIdx); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
}
function palRun(i) {
  const it = palShown[i]; if (!it) return;
  closePalette();
  if (it.go) location.hash = it.go; else if (it.run) it.run();
}
function closePalette() { el('palette').hidden = true; }

Object.assign(window.App, {

});
